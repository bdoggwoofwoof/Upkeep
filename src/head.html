<title>Upkeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Upkeep · a household notebook on the kitchen counter.
   Layout: one column of hairline-divided lists on phones; sidebar + two columns from 900px. */
:root{
  --paper:#F5F1E8; --leaf:#FBF9F4; --tint:#EDE7DA; --rule:#DED6C6;
  --ink:#2B2D29; --ink-2:#5F625A; --ink-3:#8A8C82;
  --forest:#2E4A3B; --forest-ink:#FBF9F4; --forest-wash:#E1E7DC;
  --sage:#7A8768; --clay:#9C5F45;
  --ok:#3E6B4F; --soon:#8C6414; --soon-wash:#F1E6CD; --late:#9E3A28; --late-wash:#F3DFD8;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
  --sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111713; --leaf:#172019; --tint:#1C2620; --rule:#26322A;
  --ink:#E7E5DC; --ink-2:#A7AB9F; --ink-3:#7D8276;
  --forest:#9BC2A6; --forest-ink:#0F1511; --forest-wash:#1F2E25;
  --sage:#A8B48F; --clay:#D19A7E;
  --ok:#8FBF9C; --soon:#D9AF5E; --soon-wash:#2E2817; --late:#E28B76; --late-wash:#36201B; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#111713; --leaf:#172019; --tint:#1C2620; --rule:#26322A;
  --ink:#E7E5DC; --ink-2:#A7AB9F; --ink-3:#7D8276;
  --forest:#9BC2A6; --forest-ink:#0F1511; --forest-wash:#1F2E25;
  --sage:#A8B48F; --clay:#D19A7E;
  --ok:#8FBF9C; --soon:#D9AF5E; --soon-wash:#2E2817; --late:#E28B76; --late-wash:#36201B; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--forest)}
:focus-visible{outline:2px solid var(--forest);outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:var(--s5) 128px}

/* Type */
h1{font-family:var(--serif);font-weight:400;font-size:2.05rem;line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-family:var(--sans);font-weight:600;font-size:.98rem;letter-spacing:.005em;margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)}
.stamp{font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.lede{max-width:52ch;color:var(--ink-2);margin:var(--s2) 0 var(--s5);font-size:1.02rem}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s5)}
header.top > div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}

/* Sections and lists: rules, not boxes */
section.group{margin-bottom:var(--s6)}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--rule)}
.group-head h2{font-family:var(--serif);font-weight:500;font-size:1.22rem}
.list{display:flex;flex-direction:column}
.list > *{border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;padding:var(--s3) 0;min-height:56px;background:var(--paper);position:relative}
button.row{border:0;border-bottom:1px solid var(--rule);text-align:start;width:100%;color:inherit}
.row .main{min-width:0;background:none;border:0;padding:2px 0;text-align:start;display:flex;flex-direction:column;gap:3px;color:inherit}
.row .name{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.row .meta{font-size:.84rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px var(--s3)}
.row .meta > span + span::before{content:"";display:none}
.std{font-size:.84rem;color:var(--ink-2);overflow-wrap:anywhere;max-width:60ch}
.std b{color:var(--ink);font-weight:600}
.empty{padding:var(--s4) 0;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.empty strong{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}

/* Task row: name + who on the left, complete button at the thumb edge */
.task{grid-template-columns:1fr auto auto}
.task .due{font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.task .due.late{color:var(--late)} .task .due.today{color:var(--forest)} .task .due.soon{color:var(--soon)} .task .due.later{color:var(--ink-3);font-weight:500}
.due svg{width:12px;height:12px}
.who{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--ink-2);white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:.7rem;font-weight:700;flex:none;color:#fff;letter-spacing:0}
.check{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;flex:none;margin-inline-end:-8px}
.check i{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--ink-3);display:grid;place-items:center;transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease)}
.check svg{opacity:0;transition:opacity .15s}
.check:hover i{border-color:var(--forest)}
.check.done i,.row.completing .check i{background:var(--forest);border-color:var(--forest)}
.check.done svg,.row.completing .check svg{opacity:1}
.row.completing{transition:opacity .35s var(--ease) .25s,transform .35s var(--ease) .25s}
.row.completing .name{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-2)}
.row.gone{opacity:0;transform:translateX(12px)}
.claim{grid-column:1/-1}

/* Swipe: content slides, actions sit behind */
.swipe{position:relative;overflow:hidden}
.swipe .acts{position:absolute;inset-block:0;inset-inline-end:0;display:flex}
.swipe .acts button{border:0;padding:0 var(--s4);font-weight:600;font-size:.85rem;color:var(--forest-ink)}
.swipe .acts .a-tom{background:var(--sage)} .swipe .acts .a-skip{background:var(--ink-2)}
.swipe .row{transition:transform .2s var(--ease);touch-action:pan-y}

.steps{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.steps label{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.steps input{margin-top:3px;accent-color:var(--forest);width:18px;height:18px}
.linkish{background:none;border:0;padding:0;color:var(--forest);font-weight:600;font-size:.86rem;text-align:start}

/* Today summary line instead of stat tiles */
.summary{font-size:1.02rem;color:var(--ink-2);margin:-8px 0 var(--s5);max-width:52ch}
.summary b{color:var(--ink);font-weight:600}
.caught{padding:var(--s6) 0 var(--s5);border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.caught .big{font-family:var(--serif);font-size:1.6rem;color:var(--forest)}
.tonight{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;padding:var(--s4);border-radius:var(--r);background:var(--tint);border:0;width:100%;text-align:start;color:inherit;margin-bottom:var(--s6)}
.tonight .t-title{font-family:var(--serif);font-size:1.25rem}
.tonight .t-meta{font-size:.86rem;color:var(--ink-2)}
.tonight.closed{background:var(--forest-wash)}
.progress{height:4px;border-radius:99px;background:var(--rule);overflow:hidden;margin:var(--s2) 0 2px}
.progress i{display:block;height:100%;background:var(--forest);transition:width .5s var(--ease)}
.fresh i{background:var(--sage)}

/* Controls */
.btn{border:1px solid var(--rule);background:var(--leaf);border-radius:999px;padding:10px 18px;font-weight:600;font-size:.94rem;min-height:44px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.btn.danger{color:var(--late)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.small{padding:6px 14px;font-size:.86rem;min-height:36px}
a.btn{text-decoration:none}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:.82rem;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r-sm);padding:10px 12px;width:100%;min-width:0;min-height:44px}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.toolbar{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
.toolbar input[type=search]{flex:1 1 200px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:var(--s4);scrollbar-width:none}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:6px 13px;font-size:.86rem;white-space:nowrap;color:var(--ink-2);min-height:34px;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink);border-color:var(--forest)}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:.84rem;border-radius:999px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.switch{display:flex;align-items:center;gap:var(--s3);font-size:.94rem}
.switch input{width:20px;height:20px;accent-color:var(--forest)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{display:flex;align-items:center;gap:5px;font-size:.86rem;border:1px solid var(--rule);border-radius:999px;padding:5px 10px}
.daypick input{accent-color:var(--forest)}
.cmtform{display:flex;gap:var(--s2)}
.cmtform input{flex:1}
.calbox{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);border-radius:var(--r);background:var(--tint)}
.calbox > b{font-weight:600}
.note{font-size:.86rem;color:var(--ink-2);margin:0}
.note.err{color:var(--late)}
.banner{display:flex;gap:var(--s2);align-items:baseline;flex-wrap:wrap;padding:var(--s3) 0;border-bottom:1px solid var(--rule);font-size:.92rem;color:var(--ink)}
.banner::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--soon);flex:none;transform:translateY(-2px)}
.confirm{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;font-size:.92rem}
.pill{font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--tint);color:var(--ink-2)}
.pill.late{background:var(--late-wash);color:var(--late)} .pill.soon{background:var(--soon-wash);color:var(--soon)} .pill.today{background:var(--forest-wash);color:var(--forest)}
.checked-by{font-size:.8rem;color:var(--ok);font-weight:600;white-space:nowrap}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--clay);color:#fff;font-size:.66rem;line-height:17px;font-weight:700}

/* Rooms grid (Home) */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s5) var(--s4);margin-bottom:var(--s6)}
.room{background:none;border:0;padding:0;text-align:start;color:inherit;display:flex;flex-direction:column;gap:4px}
.room b{font-family:var(--serif);font-weight:500;font-size:1.12rem}
.room span{font-size:.82rem;color:var(--ink-2)}

/* Feed and comments */
.feed{display:flex;flex-direction:column}
.feed .ev{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:start;padding:var(--s3) 0;border-bottom:1px solid var(--rule);font-size:.92rem}
.feed .ev.new b{color:var(--clay)}
.comments{display:flex;flex-direction:column;gap:var(--s3)}
.cmt{display:grid;grid-template-columns:auto 1fr;gap:var(--s2);font-size:.92rem}
.cmt .when{font-size:.76rem;color:var(--ink-3)}

/* Bottom navigation; becomes a sidebar on wide screens */
nav.tabs{position:fixed;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:680px}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--ink-3);position:relative;min-height:56px}
nav.tabs button[aria-current="page"]{color:var(--forest)}
nav.tabs svg{width:23px;height:23px}
nav.tabs .brand{display:none}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgb(16 22 18 / .36);z-index:30;animation:fade .2s var(--ease)}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:31;display:flex;justify-content:center}
.sheet .panel{background:var(--leaf);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--s5) max(18px,env(safe-area-inset-right,0px)) calc(var(--s5) + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--s4);animation:rise .28s var(--ease)}
.sheet .bar{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.sheet h2{font-family:var(--serif);font-weight:500;font-size:1.4rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:999px;display:flex;gap:var(--s4);align-items:center;z-index:40;font-size:.92rem;max-width:calc(100% - 32px);animation:rise .22s var(--ease)}
.toast button{background:none;border:0;color:inherit;font-weight:700}

/* Setup */
.packs{display:grid;gap:0}
.pack{display:grid;grid-template-columns:auto 1fr;gap:var(--s3);align-items:start;padding:var(--s3) 0;border-bottom:1px solid var(--rule)}
.pack input{width:20px;height:20px;margin-top:2px;accent-color:var(--forest)}
.pack small{color:var(--ink-2);display:block}

/* Kid view: bigger, warmer, a little playful */
.kidpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s4)}
.kidpick button{background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r-lg);padding:var(--s5) var(--s3);display:flex;flex-direction:column;align-items:center;gap:var(--s2);font-size:1.15rem;color:inherit}
.kidpick span{color:var(--ink-2);font-size:.86rem}
.kidstars{display:inline-flex;align-items:center;gap:8px;color:var(--soon);background:var(--soon-wash);border-radius:999px;padding:8px 16px;max-width:100%;flex-wrap:wrap;margin-bottom:var(--s5)}
.kidstars b{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1}
.kidstars.pop svg{animation:pop .5s var(--ease)}
.kidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:var(--s4)}
.kidcard{background:var(--leaf);border:2px solid var(--rule);border-radius:var(--r-lg);padding:var(--s5);text-align:start;display:flex;flex-direction:column;gap:6px;min-height:140px;color:inherit}
.kidcard b{font-family:var(--serif);font-weight:500;font-size:1.45rem;line-height:1.15}
.kidcard span{color:var(--ink-2);font-size:.95rem}
.kidcard em{font-style:normal;font-weight:700;color:var(--soon);margin-top:auto}
.kidcard.done{background:var(--forest-wash);border-color:var(--forest)}
.kidcard.done em,.kidcard.done b{color:var(--forest)}

@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
@keyframes settle{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.check.done i,.row.completing .check i{animation:settle .3s var(--ease)}

@media (max-width:420px){ h1{font-size:1.8rem} .grid2{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* Tablet and desktop: sidebar navigation, two-column Today */
@media (min-width:900px){
  nav.tabs{inset:0 auto 0 0;width:220px;flex-direction:column;justify-content:flex-start;border-top:0;border-inline-end:1px solid var(--rule);padding:calc(var(--s6) + env(safe-area-inset-top,0px)) var(--s3) var(--s4);background:var(--paper);backdrop-filter:none}
  nav.tabs .in{display:flex;flex-direction:column;gap:2px;max-width:none}
  nav.tabs .brand{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--forest);padding:0 var(--s3) var(--s5)}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:var(--s3);font-size:.95rem;padding:10px var(--s3);border-radius:var(--r-sm);min-height:44px}
  nav.tabs button[aria-current="page"]{background:var(--tint)}
  nav.tabs svg{width:20px;height:20px}
  .badge{position:static;margin-inline-start:auto}
  .wrap{max-width:1040px;padding-inline-start:calc(220px + 48px);padding-inline-end:48px;padding-block:var(--s7) var(--s7)}
  .today-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s7);align-items:start}
  .sheet{inset:0;align-items:center}
  .sheet .panel{border-radius:var(--r-lg);max-height:86vh}
  .toast{bottom:var(--s5);left:calc(50% + 110px)}
  h1{font-size:2.4rem}
}
