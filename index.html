<style>
/* Layout: one-column phone app, bottom tab bar, bottom sheets for editing. Feel: a tidy utility closet, quiet and sure. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E9EDE7; --ink:#1B211D; --muted:#5B655E; --line:#D9DED7;
  --accent:#2D5D4C; --accent-soft:#DCE8E2; --on-accent:#FFFFFF;
  --late:#A93E2A; --late-soft:#F6E1DC; --soon:#8A6100; --soon-soft:#F4EAD2;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111513; --surface:#191F1C; --sunk:#0C0F0D; --ink:#E6EBE7; --muted:#97A29A; --line:#29312C;
  --accent:#86C5AB; --accent-soft:#1F3029; --on-accent:#0D1411;
  --late:#E58571; --late-soft:#3A221D; --soon:#DDB15A; --soon-soft:#33291A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191F1C; --sunk:#0C0F0D; --ink:#E6EBE7; --muted:#97A29A; --line:#29312C;
  --accent:#86C5AB; --accent-soft:#1F3029; --on-accent:#0D1411;
  --late:#E58571; --late-soft:#3A221D; --soon:#DDB15A; --soon-soft:#33291A; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0;text-wrap:balance}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stamp{font-family:var(--mono);font-size:.74rem;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.sync{font-size:.78rem;color:var(--muted);text-align:right}

/* load meter */
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.meter div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.meter b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.meter span{font-size:.78rem;color:var(--muted)}
.meter .is-late b{color:var(--late)}

section.group{margin-bottom:24px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{min-width:0;background:none;border:0;padding:0;text-align:left}
.row .name{font-weight:600;display:block;overflow-wrap:anywhere}
.row .meta{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.check:hover{border-color:var(--accent)}
.check svg{opacity:0}
.check.done{background:var(--accent);border-color:var(--accent)}
.check.done svg{opacity:1}
.pill{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.today{background:var(--accent-soft);color:var(--accent)}
.pill.cal{background:var(--sunk);color:var(--muted)}
.steps{grid-column:2 / -1;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.steps label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.steps input{margin-top:3px;accent-color:var(--accent)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.82rem}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted)}
.empty strong{color:var(--ink)}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--late)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.small{padding:6px 11px;font-size:.85rem}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{flex:1 1 200px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.switch{display:flex;align-items:center;gap:10px;font-size:.92rem}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:640px}
nav.tabs button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .38);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;display:flex;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.calbox{background:var(--sunk);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.note{font-size:.84rem;color:var(--muted)}
.note.err{color:var(--late)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:40;font-size:.9rem;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}

/* setup */
.packs{display:grid;gap:8px}
.pack{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pack input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.pack b{display:block}
.pack small{color:var(--muted)}
.lede{max-width:52ch;color:var(--muted);margin:6px 0 18px}
@media (max-width:420px){ h1{font-size:1.7rem} .grid2{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){ .check{transition:background .15s,border-color .15s} }


nav.tabs .in{grid-template-columns:repeat(5,1fr)}
nav.tabs button{position:relative}
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--late);color:#fff;font-size:.66rem;line-height:17px;font-weight:700}
.av{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:.68rem;font-weight:700;flex:none;vertical-align:middle}
.who{display:inline-flex;align-items:center;gap:5px}
.std{font-size:.82rem;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.std b{color:var(--ink);font-weight:600}
.progress{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:var(--accent)}
.banner{background:var(--soon-soft);color:var(--soon);border-radius:var(--r);padding:10px 12px;font-size:.88rem;margin-bottom:16px}
.feed{display:flex;flex-direction:column}
.feed .ev{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line);font-size:.9rem}
.feed .ev:first-child{border-top:0}
.feed .ev.new{background:var(--accent-soft)}
.comments{display:flex;flex-direction:column;gap:10px}
.cmt{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:.9rem}
.cmt .when{font-size:.75rem;color:var(--muted)}
.cmtform{display:flex;gap:8px}
.cmtform input{flex:1}
.checked-by{font-size:.78rem;color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick label{display:flex;align-items:center;gap:4px;font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.itemedit{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.kidpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.kidpick button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:1.1rem}
.kidpick span{color:var(--muted);font-size:.85rem}
.kidstars{display:flex;align-items:center;gap:8px;color:var(--soon);background:var(--soon-soft);border-radius:99px;padding:8px 14px;width:max-content;max-width:100%;flex-wrap:wrap;margin-bottom:16px}
.kidstars b{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1}
.kidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.kidcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px}
.kidcard b{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.15}
.kidcard span{color:var(--muted);font-size:.9rem}
.kidcard em{font-style:normal;font-weight:700;color:var(--soon);margin-top:auto}
.kidcard:hover{border-color:var(--accent)}
.kidcard.done{background:var(--accent-soft);border-color:var(--accent)}
.kidcard.done em,.kidcard.done b{color:var(--accent)}
header.top{flex-wrap:wrap}
a.btn{text-decoration:none;display:inline-block}

</style>
</head>

/* ---------- Dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const shiftDate=()=>{const d=new Date();if(d.getHours()<4)d.setDate(d.getDate()-1);return ymd(d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
function addInterval(s,t){
 const d=parse(s),n=Math.max(1,t.every|0);
 if(t.unit==="day")d.setDate(d.getDate()+n);
 else if(t.unit==="week")d.setDate(d.getDate()+7*n);
 else if(t.unit==="month"){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
 else d.setFullYear(d.getFullYear()+n);
 return ymd(d);
}
function onWeekday(s,wd){const d=parse(s);while(d.getDay()!==wd)d.setDate(d.getDate()+1);return ymd(d)}
// Seasonal tasks land on the first Saturday of their next allowed month (or stay put if already in one).
function snapSeason(s,months){
 if(!months||!months.length)return s;
 const d=parse(s);
 for(let i=0;i<24;i++){
  const m=d.getMonth()+1;
  if(months.includes(m)){
   if(i===0)return s;
   const f=new Date(d.getFullYear(),d.getMonth(),1);while(f.getDay()!==6)f.setDate(f.getDate()+1);return ymd(f);
  }
  d.setDate(1);d.setMonth(d.getMonth()+1);
 }
 return s;
}
function nextAfter(t,from){
 let n;
 if(t.flexible)n=addInterval(from,t);else{n=t.next;do{n=addInterval(n,t)}while(n<=from)}
 if(t.months&&t.months.length){
  // for seasonal tasks the interval is the minimum gap; then snap to the next allowed month
  const gap=t.months.length>1?Math.floor(12/t.months.length):12*Math.max(1,t.unit==="year"?t.every:1);
  const d=parse(from);d.setDate(1);d.setMonth(d.getMonth()+Math.max(1,gap-1));n=snapSeason(ymd(d),t.months);
 }
 if(t.unit==="week"&&t.weekday!=null&&!t.flexible)n=onWeekday(n,t.weekday);
 return n;
}
function nice(s){
 const diff=daysBetween(today(),s);
 if(diff===0)return"Today";if(diff===1)return"Tomorrow";if(diff===-1)return"Yesterday";
 const d=parse(s),o={weekday:"short",month:"short",day:"numeric"};if(d.getFullYear()!==new Date().getFullYear())o.year="numeric";
 return d.toLocaleDateString(undefined,o);
}
const clock=ms=>new Date(ms).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
function ago(ms){const m=Math.round((Date.now()-ms)/6e4);if(m<1)return"just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" hr ago";return new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
const t12=s=>{const [h,m]=(s||"21:00").split(":").map(Number);const d=new Date();d.setHours(h,m);return clock(d)};
function freqText(t){
 if(t.months&&t.months.length)return t.months.length===1?`Every ${MONTHS[t.months[0]-1]}`+(t.unit==="year"&&t.every>1?` · every ${t.every} yrs`:""):t.months.map(m=>MONTHS[m-1]).join(" & ");
 const n=t.every|0,u=t.unit;
 if(u==="day")return n===1?"Daily":`Every ${n} days`;
 if(u==="week")return(n===1?"Weekly":`Every ${n} weeks`)+(t.weekday!=null?` on ${DAYS[t.weekday].slice(0,3)}`:"");
 if(u==="month")return n===1?"Monthly":n===3?"Every 3 months":n===6?"Twice a year":n===12?"Yearly":`Every ${n} months`;
 return n===1?"Yearly":`Every ${n} years`;
}
const intervalDays=t=>t.months&&t.months.length?Math.round(365/t.months.length)*(t.unit==="year"?Math.max(1,t.every):1):({day:1,week:7,month:30,year:365}[t.unit])*Math.max(1,t.every|0);
function status(t){if(paused())return"later";const d=daysBetween(today(),t.next);return d<0?"late":d===0?"today":d<=7?"soon":"later"}

function loadDocs(docs,v){
 const seenAct=new Set(Object.keys(D.activity));const first=S.v===0;
 D.house=docs.house&&docs.house.main?Object.assign({},docs.house.main):null;
 COLS.forEach(c=>{const m={};Object.entries(docs[c]||{}).forEach(([id,d])=>m[id]=Object.assign({},d,{id}));D[c]=m});

async function api(method,body,query){
 const url="/api/house"+(query?"?"+new URLSearchParams(query):"");
 const r=await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
 if(r.status===404)throw Object.assign(new Error("not_found"),{code:"not_found"});
 if(!r.ok)throw Object.assign(new Error("server"),{code:"server"});
 return r.json();
}
let flushTimer=null;
function scheduleFlush(){clearTimeout(flushTimer);flushTimer=setTimeout(flush,350)}
async function flush(){
 if(!ME.house||S.flushing||!S.ops.length)return;
 S.flushing=true;const batch=S.ops.slice(0,250);
 try{
  const res=await api("POST",{h:ME.house,k:ME.key,ops:batch});
  S.ops=S.ops.slice(batch.length);ls.set("upkeep-ops",S.ops);
  loadDocs(res.docs,res.v);if(S.note.startsWith("Offline"))S.note="";render();
 }catch(e){
  if(e.code==="not_found"){S.note="This house link no longer works. Ask for a new invite link.";}
  else S.note="Offline. Your changes are saved on this phone and will sync when you're back online.";
  render();setTimeout(scheduleFlush,8000);
 }
 S.flushing=false;if(S.ops.length&&!S.note)scheduleFlush();
}
async function poll(){
 if(!ME.house||document.hidden||S.flushing||S.ops.length)return;
 try{const res=await api("GET",null,{h:ME.house,k:ME.key,v:S.v});if(!res.same){loadDocs(res.docs,res.v);render()}if(S.note.startsWith("Offline")){S.note="";render()}}
 catch(e){if(e.code!=="not_found"&&!S.note){S.note="Offline. Your changes are saved on this phone and will sync when you're back online.";render()}}
}
setInterval(poll,15000);
window.addEventListener("online",()=>{scheduleFlush();poll()});
async function boot(){
 const m=/#join=([a-z0-9]{10})\.([A-Za-z0-9_-]{10,})/.exec(location.hash);
 if(m){ui.join={h:m[1],k:m[2]};history.replaceState(null,"",location.pathname)}
 if(!ME.house){S.mode="welcome";render();if(ui.join)joinHouse(ui.join.h,ui.join.k);return}
 const c=ls.get("upkeep-cache",null);
 if(c&&c.h===ME.house){Object.assign(D,c.D);S.v=c.v||0;S.ops.forEach(applyOp);S.mode="db";render()}
 try{const res=await api("GET",null,{h:ME.house,k:ME.key});S.v=0;loadDocs(res.docs,res.v);S.mode="db";S.note="";afterLoad()}
 catch(e){
  if(e.code==="not_found"){S.mode="welcome";S.note="That house couldn't be found. Start a new one or use an invite link.";ME.house="";saveMe();return}
  S.mode="db";S.note="Offline. Showing what's saved on this phone.";render();
 }
 scheduleFlush();
}

function readDraft(){
 const d=ui.sheet.draft,v=id=>document.getElementById(id);if(!v("f-name"))return d;
 d.name=v("f-name").value.trim();d.room=v("f-room").value;d.mins=Math.max(1,+v("f-mins").value||15);d.every=Math.max(1,+v("f-every").value||1);d.unit=v("f-unit").value;
 if(v("f-wd"))d.weekday=+v("f-wd").value;if(v("f-who"))d.assignee=v("f-who").value;
 d.rotate=[...document.querySelectorAll('[data-rot="task"]:checked')].map(x=>x.value);
 if(d.rotate.length>1&&!d.rotate.includes(d.assignee))d.assignee=d.rotate[0];
 d.months=[...document.querySelectorAll("[data-month]:checked")].map(x=>+x.dataset.month);
 d.next=v("f-next").value||today();d.time=v("f-time").value||"09:00";d.flexible=v("f-flex").checked;d.photoProof=v("f-photo").checked;
 d.standard=v("f-std").value.trim();d.steps=v("f-steps").value.split("\n").map(x=>x.trim()).filter(Boolean);d.notes=v("f-notes").value.trim();
 return d;

function openTask(id){const t=D.tasks[id];if(!t)return;const d=JSON.parse(JSON.stringify(t));delete d.id;d.months=d.months||[];d.rotate=d.rotate||[];ui.sheet={kind:"task",id,draft:d};ui.calMsg=null;renderLayer();if(!ui.cal.list&&!ui.cal.err)loadCalendars()}
function saveTask(){

 if(d.unit==="week"){if(d.weekday==null)d.weekday=parse(d.next).getDay();d.next=onWeekday(d.next,d.weekday)}else d.weekday=null;
 if(d.months.length)d.next=snapSeason(d.next,d.months);
 d.stepsDone=(d.stepsDone||[]).filter(i=>i<d.steps.length);
 const id=ui.sheet.isNew?rid():ui.sheet.id,prev=D.tasks[id];put("tasks",id,d);
 if(d.assignee&&d.assignee!==myPid()&&(!prev||prev.assignee!==d.assignee))logEvent({kind:"assign",text:`gave ${pName(d.assignee)} “${d.name}”`,ref:"task:"+id});

 if(ds.gnodel){ui.sheet.confirmDel=false;renderLayer();return}
 if(ds.gdel){const s=ui.sheet;ui.sheet=null;remove(s.col,s.id);return}
 if(ds.infoadd!=null){const id=rid();put("info",id,{label:ds.infoadd||"New item",value:"",order:Date.now()});openForm("info:"+id);return}
 if(ds.list){ui.list=ds.list;render();return}
 if(ds.newlist){ui.newList=!ui.newList;render();setTimeout(()=>document.getElementById("nl-name")?.focus(),0);return}
 if(ds.savelist){const n=(document.getElementById("nl-name").value||"").trim().slice(0,30);if(n){putHouse({lists:[...new Set([...((D.house&&D.house.lists)||[]),n])]});ui.list=n}ui.newList=false;render();return}
 if(ds.additem2){const inp=document.getElementById("li-new"),txt=inp.value.trim();if(!txt)return;const ex=Object.values(D.items).find(i=>i.list===ui.list&&i.text.toLowerCase()===txt.toLowerCase());if(ex)patch("items",ex.id,{done:false,who:myPid(),at:Date.now()});else put("items",rid(),{list:ui.list,text:txt,done:false,who:myPid(),at:Date.now(),n:0});setTimeout(()=>document.getElementById("li-new")?.focus(),0);return}
 if(ds.buy){const i=D.items[ds.buy];patch("items",i.id,{done:true,n:(i.n||0)+1,boughtBy:myPid(),boughtAt:Date.now()});return}
 if(ds.again){patch("items",ds.again,{done:false,who:myPid(),at:Date.now()});return}
 if(ds.rmli){remove("items",ds.rmli);return}
 if(ds.loadcal){loadCalendars();return}
 if(ds.gocal){ui.sheet=null;ui.tab="more";ui.more="cal";render();loadCalendars();return}
 if(ds.calreset){delete ME.calAdded[ds.calreset];saveMe();return}
 if(ds.chart){saveChart();return}
 if(ds.pause){startPause();return}
 if(ds.unpause){endPause();return}
 if(ds.prof){if(!(D.house&&D.house.setupDone)){ui.setup[ds.prof]=ds.v;render()}else{const pr=Object.assign({},D.house.profile||{},{[ds.prof]:ds.v});putHouse({profile:pr})}return}
 if(ds.proft){if(!(D.house&&D.house.setupDone)){ui.setup[ds.proft]=!ui.setup[ds.proft];render()}else{const pr=Object.assign({},D.house.profile||{});pr[ds.proft]=!pr[ds.proft];putHouse({profile:pr})}return}
 if(ds.addcal){
  const key=ds.addcal;let ev;
  if(key.startsWith("task:")){ev=ui.sheet&&ui.sheet.kind==="task"?readDraft():D.tasks[key.slice(5)]}else ev=routineAsEvent(D.routines[key.slice(8)]);
  ui.calBusy=key;ui.calMsg=null;render();const r=await addToCalendar(key,ev);ui.calBusy=null;ui.calMsg=r.ok?null:{key,msg:r.msg};render();if(r.ok)toast(`“${ev.name}” is on your calendar`);return;
 }
 if(ds.bulk){
  const list=tasks().filter(t=>!ME.calAdded["task:"+t.id]&&(t.assignee===myPid()||!t.assignee||S.isOwner));
  ui.bulk={running:true,done:0,total:list.length};render();
  for(const t of list){const r=await addToCalendar("task:"+t.id,t);if(!r.ok){ui.bulk={running:false,msg:`Stopped after ${ui.bulk.done}: ${r.msg}`,err:true};render();return}ui.bulk.done++;render()}
  ui.bulk={running:false,msg:`Added ${list.length} repeating events.`};render();return;
 }
 if(ds.setup!=null){
  if(ds.setup==="1"){ui.setup.closing=document.getElementById("su-closing").checked;setupHouse(ui.setup)}
  else putHouse({setupDone:true,created:Date.now(),profile:{home:ui.setup.home,own:ui.setup.own},kidApproval:true});
  ui.tab="today";render();return;
 }
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.step){const t=D.tasks[el.dataset.step],i=+el.dataset.i;let sd=[...(t.stepsDone||[])];if(el.checked){if(!sd.includes(i))sd.push(i)}else sd=sd.filter(x=>x!==i);patch("tasks",t.id,{stepsDone:sd});return}
 if(el.dataset.rday!=null){const r=D.routines[ui.routine];let days=[...(r.days||[0,1,2,3,4,5,6])];const i=+el.dataset.rday;days=el.checked?[...new Set([...days,i])].sort():days.filter(x=>x!==i);updateRoutine(r,{days});return}
 
 if(el.id==="remind"){ME.reminder=+el.value;saveMe();return}
 if(el.id==="deftime"){ME.defaultTime=el.value||"09:00";saveMe();return}
 if(el.id==="histwho"){ui.histWho=el.value;render();return}
 if(el.id==="kidok"){putHouse({kidApproval:el.checked});return}
 if(el.id==="cpp"){putHouse({centsPerPoint:+el.value});return}
 if(el.id==="f-unit"){readDraft();if(ui.sheet.draft.unit==="week"&&ui.sheet.draft.weekday==null)ui.sheet.draft.weekday=parse(ui.sheet.draft.next).getDay();renderLayer();return}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&ui.sheet){ui.sheet=null;renderLayer()}
 if(e.key==="Enter"&&e.target.id==="c-text")document.querySelector("[data-comment]")?.click();
 if(e.key==="Enter"&&e.target.id==="r-new")document.querySelector("[data-additem]")?.click();
 if(e.key==="Enter"&&e.target.id==="li-new")document.querySelector("[data-additem2]")?.click();
 if(e.key==="Enter"&&e.target.id==="nl-name")document.querySelector("[data-savelist]")?.click();
});
let qTimer=null;
document.addEventListener("input",e=>{if(e.target.id==="q"){ui.q=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(()=>{const p=e.target.selectionStart;render();const q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(p,p)}},200)}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.mode!=="loading"){resolveNames();render()}});

/* ---------- Web app: identity, invites, calendar feeds, notifications ---------- */
function myPid(){return ME.pid&&D.people[ME.pid]?ME.pid:""}
function resolveNames(){}
function loadCalendars(){}
function actorName(a){return pShort(a.actor||a.who)}
function liveNotice(a){
 const text=`${pName(a.actor||a.who)} ${a.text}`;toast(text);
 if(ME.notify&&document.hidden&&"Notification" in window&&Notification.permission==="granted"){
  try{navigator.serviceWorker?.ready.then(r=>r.showNotification("Upkeep",{body:text,icon:"/icon-192.png",tag:a.id})).catch(()=>new Notification("Upkeep",{body:text}))}catch(e){}
 }
}
function copyText(text,okMsg){
 const done=()=>toast(okMsg||"Copied");
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,()=>{fallbackCopy(text);done()});else{fallbackCopy(text);done()}
}
function fallbackCopy(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}
function shareInvite(){
 const link=inviteLink();
 if(navigator.share)navigator.share({title:"Join our house on Upkeep",text:"Here's our house on Upkeep. Open it to see your chores.",url:link}).catch(()=>{});
 else copyText(link,"Invite link copied");
}
function viewWelcome(){
 return `<header class="top"><div><div class="eyebrow">Upkeep</div><h1>Run the house together</h1></div></header>${S.note?`<div class="banner">${esc(S.note)}</div>`:""}
 <p class="lede">Every chore and maintenance job your home needs, on the right schedule, split fairly across the family.</p>
 <section class="group"><div class="calbox"><b>Start a new house</b><label class="field"><span>Your name</span><input type="text" id="w-name" placeholder="What the family calls you" autocomplete="given-name"></label><div><button class="btn primary" data-create="1" ${ui.busy?"disabled":""}>${ui.busy?"Setting up…":"Start my house"}</button></div></div></section>
 <section class="group"><div class="calbox"><b>Join a house</b><p class="note" style="margin:0">Someone in your house can send you an invite link from the Family tab. Open it on this phone, or paste it here.</p><div class="cmtform"><input type="text" id="w-link" placeholder="Paste the invite link"><button class="btn" data-joinlink="1" ${ui.busy?"disabled":""}>Join</button></div></div></section>`;
}
function viewWhoAmI(){
 const ad=adults();
 return `<header class="top"><div><div class="eyebrow">You're in</div><h1>Who are you?</h1></div></header>
 <p class="lede">Pick yourself so your check-offs and comments have your name on them.</p>
 <div class="kidpick">${ad.map(p=>`<button data-iam="${p.id}">${av(p.id,56)}<b>${esc(pName(p.id))}</b></button>`).join("")}</div>
 <section class="group" style="margin-top:18px"><div class="calbox"><b>I'm not listed</b><div class="cmtform"><input type="text" id="w-me" placeholder="Your name"><button class="btn primary" data-iamnew="1">Add me</button></div></div></section>`;
}
function calButtons(key,ev){
 const o=key.startsWith("task:")?{task:key.slice(5)}:{routine:key.slice(8)};
 return `<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a class="btn small primary" href="${esc(gcalLink(ev))}" target="_blank" rel="noopener">Add to Google Calendar</a><a class="linkish" href="${esc(icsUrl(Object.assign({dl:"1"},o)))}">Apple / Outlook (.ics)</a></div><p class="note" style="margin:0">Tip: subscribing under More → Calendar keeps every task in sync on its own.</p>`;
}
function moreCal(){
 const me=myPid(),mine=icsUrl({p:me||"all"}),all=icsUrl({p:"all"});
 return `<div class="calbox"><b>Subscribe once, stay in sync</b>
 <p class="note" style="margin:0">Your calendar app pulls Upkeep's schedule and refreshes it every few hours, so new tasks, finished tasks and new due dates show up on their own. It arrives as its own "Upkeep" calendar, separate from your main one. Seasonal tasks land on the first Saturday of their month.</p>
 <label class="field"><span>Reminder before each task</span><select id="remind">${[[-1,"None"],[0,"At start"],[10,"10 min before"],[30,"30 min before"],[60,"1 hour before"],[1440,"1 day before"]].map(([v,l])=>`<option value="${v}" ${Number(ME.reminder)===v?"selected":""}>${l}</option>`).join("")}</select></label>
 <div class="field"><span>${me?"My tasks and up-for-grabs tasks":"All tasks"}</span><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn primary small" href="${esc(googleSub(mine))}" target="_blank" rel="noopener">Google Calendar</a><a class="btn small" href="${esc(webcal(mine))}">Apple Calendar</a><button class="btn small" data-copy="${esc(mine)}">Copy link</button></div></div>
 ${me?`<div class="field"><span>The whole house</span><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn small" href="${esc(googleSub(all))}" target="_blank" rel="noopener">Google Calendar</a><a class="btn small" href="${esc(webcal(all))}">Apple Calendar</a><button class="btn small" data-copy="${esc(all)}">Copy link</button></div></div>`:""}
 <p class="note" style="margin:0">Google: after it opens, choose Add. If the button doesn't work on your phone, copy the link and add it on a computer under Other calendars → From URL. Anyone with this link can see your house's tasks, so share it only with family.</p>
 <div><a class="linkish" href="${esc(icsUrl({p:"all",dl:"1"}))}">Download everything as a one-time .ics file</a></div>
 <label class="field"><span>Default time for new tasks</span><input type="time" id="deftime" value="${esc(ME.defaultTime||"09:00")}"></label></div>
 <section class="group" style="margin-top:18px"><div class="calbox"><b>Fridge chart</b><p class="note" style="margin:0">This week's chores by person plus the closing shift, as a page you can print.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-chart="1">Open printable chart</button></div></div></section>`;
}
function saveChart(){
 const blob=new Blob([chartHtml().replace("</body>","<script>setTimeout(()=>print(),400)<\/script></body>")],{type:"text/html"});
 const u=URL.createObjectURL(blob),w=window.open(u,"_blank");
 if(!w){const a=document.createElement("a");a.href=u;a.download=`upkeep-week-${today()}.html`;document.body.appendChild(a);a.click();a.remove()}
 setTimeout(()=>URL.revokeObjectURL(u),60000);
}
function moreSettings(){
 const pr=(D.house&&D.house.profile)||{};
 const canNotify="Notification" in window;
 return `<section class="group"><div class="calbox"><b>Away mode</b><p class="note" style="margin:0">Going on a trip? Turn this on and nothing goes overdue. When you're back, every due date moves forward by the days you were gone.</p>${paused()?`<button class="btn primary" data-unpause="1">I'm back</button>`:`<button class="btn" data-pause="1">Turn on Away mode</button>`}</div></section>
 <section class="group"><div class="calbox"><b>Notifications on this device</b><p class="note" style="margin:0">Get a notice when someone finishes a task, checks a shift item, comments or nudges you, while Upkeep is open or in the background. On iPhone, add Upkeep to your Home Screen first (Share → Add to Home Screen).</p>${canNotify?`<label class="switch"><input type="checkbox" id="notify" ${ME.notify&&Notification.permission==="granted"?"checked":""}><span>Show notifications</span></label>${Notification.permission==="denied"?`<p class="note err">Notifications are blocked for Upkeep in this browser's settings.</p>`:""}`:`<p class="note">This browser doesn't support notifications.</p>`}</div></section>
 <section class="group"><div class="group-head"><h2>Your home</h2></div>${profileForm(pr)}<p class="note">Changing this updates the Suggested list under House. It doesn't remove tasks you already have.</p></section>
 <section class="group"><div class="calbox"><b>This phone</b><p class="note" style="margin:0">Signed in as ${esc(pName(myPid()))}. ${S.ops.length?`${S.ops.length} change${S.ops.length>1?"s":""} waiting to sync.`:"Everything is synced."}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn small" data-switchme="1">I'm someone else</button>${ui.confirmLeave?`<span class="confirm">Leave this house on this phone? <button class="btn small danger" data-leave="2">Leave</button><button class="btn small" data-leave="0">Stay</button></span>`:`<button class="btn small danger" data-leave="1">Leave this house</button>`}</div></div></section>`;
}
function inviteBlock(){
 return `<div class="calbox" style="margin-top:12px"><b>Invite family</b><p class="note" style="margin:0">Send this link to adults in your house. They open it, pick their name and they're in. Anyone with the link can see and change your house, so share it only with family. Kids don't need it; use Kid view on any family phone.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary small" data-invite="1">Share invite link</button><button class="btn small" data-copy="${esc(inviteLink())}">Copy link</button></div></div>`;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const ds=b.dataset;
 if(ds.create){createHouse((document.getElementById("w-name").value||"").trim().slice(0,30));return}
 if(ds.joinlink){const v=document.getElementById("w-link").value;const m=/join=([a-z0-9]{10})\.([A-Za-z0-9_-]{10,})/.exec(v);if(!m){S.note="That doesn't look like an Upkeep invite link.";render();return}joinHouse(m[1],m[2]);return}
 if(ds.iam){ME.pid=ds.iam;saveMe();return}
 if(ds.iamnew){const n=(document.getElementById("w-me").value||"").trim().slice(0,30);if(!n)return;const pid=rid();ME.pid=pid;ls.set("upkeep-me",ME);put("people",pid,{name:n,role:"adult",color:COLORS[Object.keys(D.people).length%COLORS.length],joined:today()});logEvent({kind:"join",text:"joined the house"});return}
 if(ds.switchme){ME.pid="";saveMe();return}
 if(ds.leave){if(ds.leave==="1"){ui.confirmLeave=true;render()}else if(ds.leave==="2"){ui.confirmLeave=false;leaveHouse()}else{ui.confirmLeave=false;render()}return}
 if(ds.invite){shareInvite();return}
 if(ds.copy){copyText(ds.copy,"Link copied");return}
});
document.addEventListener("change",async e=>{
 if(e.target.id==="notify"){
  if(e.target.checked){let p=Notification.permission;if(p==="default")p=await Notification.requestPermission();ME.notify=p==="granted";}
  else ME.notify=false;saveMe();
 }
});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
boot();

</script>
