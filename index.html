<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D5D4C">
<meta name="description" content="Every chore and maintenance job your home needs, on the right schedule, split fairly across the family.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Upkeep">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Upkeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Upkeep · a household notebook on the kitchen counter.
   Layout: one column of hairline-divided lists on phones; sidebar + two columns from 900px. */
:root{
  --paper:#F5F1E8; --leaf:#FBF9F4; --tint:#EDE7DA; --rule:#DED6C6;
  --ink:#2B2D29; --ink-2:#5F625A; --ink-3:#8A8C82;
  --forest:#2E4A3B; --forest-ink:#FBF9F4; --forest-wash:#E1E7DC;
  --sage:#7A8768; --clay:#9C5F45;
  --ok:#3E6B4F; --soon:#8C6414; --soon-wash:#F1E6CD; --late:#9E3A28; --late-wash:#F3DFD8;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
  --sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --rule-strong:#CBC1AD; --track:var(--ink-3);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111713; --leaf:#172019; --tint:#1C2620; --rule:#26322A;
  --ink:#E7E5DC; --ink-2:#A7AB9F; --ink-3:#7D8276;
  --forest:#9BC2A6; --forest-ink:#0F1511; --forest-wash:#1F2E25;
  --sage:#A8B48F; --clay:#D19A7E;
  --ok:#8FBF9C; --soon:#D9AF5E; --soon-wash:#2E2817; --late:#E28B76; --late-wash:#36201B; --rule-strong:#3A4A3F; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#111713; --leaf:#172019; --tint:#1C2620; --rule:#26322A;
  --ink:#E7E5DC; --ink-2:#A7AB9F; --ink-3:#7D8276;
  --forest:#9BC2A6; --forest-ink:#0F1511; --forest-wash:#1F2E25;
  --sage:#A8B48F; --clay:#D19A7E;
  --ok:#8FBF9C; --soon:#D9AF5E; --soon-wash:#2E2817; --late:#E28B76; --late-wash:#36201B; --rule-strong:#3A4A3F; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--forest)}
:focus-visible{outline:2px solid var(--forest);outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:var(--s5) 128px}

/* Type */
h1{font-family:var(--serif);font-weight:400;font-size:2.05rem;line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-family:var(--sans);font-weight:600;font-size:.98rem;letter-spacing:.005em;margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)}
.stamp{font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.lede{max-width:52ch;color:var(--ink-2);margin:var(--s2) 0 var(--s5);font-size:1.02rem}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
header.top > .ttl:first-child{display:flex;flex-direction:row;align-items:baseline;gap:4px 14px;flex-wrap:wrap}
.top .date{font-size:1rem;color:var(--ink-2)}
header.top > div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}

/* Sections and lists: rules, not boxes */
section.group{margin-bottom:var(--s5)}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);padding-bottom:2px}
.group-head h2{font-family:var(--serif);font-weight:500;font-size:1.2rem;line-height:1.25}
.list{display:flex;flex-direction:column}
.list > *{border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;padding:10px 0;min-height:56px;background:var(--paper);position:relative}
button.row{border:0;border-bottom:1px solid var(--rule);text-align:start;width:100%;color:inherit}
.row .main{min-width:0;background:none;border:0;padding:2px 0;text-align:start;display:flex;flex-direction:column;gap:3px;color:inherit}
.row .name{font-weight:600;font-size:1rem;line-height:1.3;overflow-wrap:anywhere}
.row .meta{font-size:.875rem;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px}
.row .meta .time{font-weight:600;color:var(--ink)}
.row .meta > span + span::before{content:"";display:none}
.std{font-size:.84rem;color:var(--ink-2);overflow-wrap:anywhere;max-width:60ch}
.std b{color:var(--ink);font-weight:600}
.empty{padding:var(--s4) 0;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.empty strong{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}

/* Task row: name + who on the left, complete button at the thumb edge */
.task{grid-template-columns:1fr auto}
.due{font-size:.8125rem;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.due.late{color:var(--late)} .due.today{color:var(--forest)} .due.soon{color:var(--soon)} .due.later{color:var(--ink-2);font-weight:500}
.due svg{width:12px;height:12px}
.who{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);white-space:nowrap}
.av-open{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--ink-3);flex:none}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:.7rem;font-weight:700;flex:none;color:#fff;letter-spacing:0}
.check{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;flex:none;margin-inline-end:-8px}
.check i{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--ink-3);display:grid;place-items:center;transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease)}
.check svg{opacity:0;transition:opacity .15s}
.check:hover i{border-color:var(--forest)}
.check.done i,.row.completing .check i{background:var(--forest);border-color:var(--forest)}
.check.done svg,.row.completing .check svg{opacity:1}
.row.completing{transition:opacity .35s var(--ease) .25s,transform .35s var(--ease) .25s}
.row.completing .name{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-2)}
.row.gone{opacity:0;transform:translateX(12px)}
.claim{grid-column:1/-1}

/* Swipe: content slides, actions sit behind */
.swipe{position:relative;overflow:hidden}
.swipe .acts{position:absolute;inset-block:0;inset-inline-end:0;display:flex}
.swipe .acts button{border:0;padding:0 var(--s4);font-weight:600;font-size:.85rem;color:var(--forest-ink)}
.swipe .acts .a-tom{background:var(--sage)} .swipe .acts .a-skip{background:var(--ink-2)} .swipe .acts .a-take{background:var(--forest)}
.swipe .row{transition:transform .2s var(--ease);touch-action:pan-y;-webkit-user-select:none;user-select:none}

.steps{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.steps label{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.steps input{margin-top:3px;accent-color:var(--forest);width:18px;height:18px}
.linkish{background:none;border:0;padding:0;color:var(--forest);font-weight:600;font-size:.875rem;text-align:start;position:relative}
.linkish::after{content:"";position:absolute;inset:-12px -6px}
.linkish.quiet{color:var(--ink-2)}

/* Today summary line instead of stat tiles */
.summary{font-size:1rem;color:var(--ink-2);margin:0 0 var(--s4);max-width:60ch}
.summary b{color:var(--ink);font-weight:600}
.caught{padding:var(--s4) 0 var(--s5);display:flex;flex-direction:column;gap:4px}
.caught .big{font-family:var(--serif);font-size:1.45rem;color:var(--forest)}
.tonight{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;padding:var(--s4);border-radius:var(--r);background:var(--tint);border:0;width:100%;text-align:start;color:inherit;margin-bottom:var(--s6)}
.tonight .t-title{font-family:var(--serif);font-size:1.25rem}
.tonight .t-meta{font-size:.86rem;color:var(--ink-2)}
.tonight.closed{background:var(--forest-wash)}
.progress{height:4px;border-radius:99px;background:var(--rule);overflow:hidden;margin:var(--s2) 0 2px}
.progress i{display:block;height:100%;background:var(--forest);transition:width .5s var(--ease)}
.fresh i{background:var(--sage)}

/* Callouts: the few things that should be seen first (weather prep, tonight's shift, the season) */
.callout{display:grid;grid-template-columns:1fr auto;align-items:center;gap:var(--s3);width:100%;text-align:start;border:0;border-radius:var(--r);padding:14px 16px;background:var(--tint);color:inherit;margin:0 0 var(--s3)}
.callout .c-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.c-kicker{display:inline-flex;align-items:center;gap:6px;font-size:.875rem;font-weight:600;color:var(--ink-2)}
.c-kicker svg{width:16px;height:16px;flex:none}
.c-title{font-family:var(--serif);font-weight:500;font-size:1.25rem;line-height:1.2;margin:0}
.c-meta{font-size:.875rem;color:var(--ink-2)}
.callout > .chev{width:20px;height:20px;color:var(--ink-2)}
.callout.alert{background:var(--soon-wash)} .callout.alert .c-kicker{color:var(--soon)}
.callout.shift .c-kicker svg{color:var(--forest)}
.callout.closed{background:var(--forest-wash)}
.callout.quiet{background:transparent;border:1px solid var(--rule)}
.callout .steps{margin-top:var(--s2)}
.c-acts{display:flex;gap:var(--s5);flex-wrap:wrap;margin-top:var(--s2)}
.meter{display:block;height:6px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--track);margin-top:var(--s2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--forest);border-radius:99px;transition:width .5s var(--ease)}
.more-note{font-size:.875rem;color:var(--ink-2);margin:var(--s2) 0 0}
.foot-link{margin:var(--s4) 0 0}

/* Sub-navigation: changes the view. Text tabs with an underline, wraps instead of clipping. */
.subnav{display:flex;flex-wrap:wrap;gap:0 var(--s5);border-bottom:1px solid var(--rule);margin:0 0 var(--s4)}
.subnav button{position:relative;background:none;border:0;padding:10px 0 9px;min-height:44px;font-size:.9375rem;font-weight:600;color:var(--ink-2);white-space:nowrap}
.subnav button[aria-current="page"]{color:var(--ink)}
.subnav button[aria-current="page"]::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--forest)}
.filter-row{margin:0 0 var(--s4)}
.jump{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;margin:-6px 0 var(--s4)}
.jump > span{font-size:.875rem;color:var(--ink-2);margin-inline-end:6px}
.jump button{background:none;border:0;min-height:44px;padding:0 8px;font-size:.875rem;font-weight:600;color:var(--forest);border-radius:var(--r-sm)}
.jump button:hover{background:var(--tint)}
/* Folding groups (Schedule) */
.fold{border-bottom:1px solid var(--rule)}
.fold > summary{list-style:none;display:flex;align-items:center;gap:var(--s3);min-height:52px;padding:12px 0 10px;cursor:pointer}
.fold .f-head{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fold .f-prev{font-size:.875rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold.day > summary{min-height:48px;padding:10px 0 8px}
.fold.day .f-title{font-family:var(--sans);font-size:1rem;font-weight:600}
.fold > summary::-webkit-details-marker{display:none}
.fold .f-title{font-family:var(--serif);font-weight:500;font-size:1.15rem}
.group-head .f-sub,.fold .f-sub{font-family:var(--sans);font-size:.8125rem;font-weight:600;color:var(--forest);margin-inline-start:6px}
.fold .chevd{width:18px;height:18px;color:var(--ink-2);align-self:center;transition:transform .2s var(--ease)}
.fold[open] .chevd{transform:rotate(180deg)}
.fold .f-body{padding-bottom:var(--s4)}
.fold .f-body > .list > *:last-child{border-bottom:0}
h3.day{display:flex;justify-content:space-between;gap:var(--s3);font-size:.875rem;font-weight:600;color:var(--ink);margin:var(--s3) 0 0;padding-bottom:4px;border-bottom:1px solid var(--rule)}
h3.day span{font-weight:500;color:var(--ink-2)}
.meter.wide{margin:var(--s2) 0 var(--s2)}
.next-seasons{margin-top:var(--s2)}
.row.link{grid-template-columns:1fr auto}
.row.link .chev{width:18px;height:18px;color:var(--ink-2)}
.done-name{color:var(--ink-2);font-weight:500}
.checked-by svg{width:13px;height:13px;margin-inline-end:3px;vertical-align:-1px}
.caught-line{color:var(--forest);margin:var(--s2) 0}
.btn-row{display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap;margin-top:var(--s3)}

/* Filters: show a subset of the same list. Outlined, a check when on. */
.filters{display:flex;flex-wrap:wrap;gap:var(--s2);margin:0}
.filter{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:5px 14px;border-radius:999px;border:1px solid var(--rule-strong);background:transparent;color:var(--ink-2);font-size:.875rem;font-weight:600;white-space:nowrap}
.filter::after{content:"";position:absolute;inset:-4px 0}
.filter .tk{width:14px;height:14px;display:none;margin-inline-start:-3px}
.filter[aria-pressed="true"]{background:var(--forest-wash);border-color:var(--forest);color:var(--forest)}
.filter[aria-pressed="true"] .tk{display:block}

/* Notices: errors and sync first, then things waiting on you, then household reminders */
.notices{margin:0 0 var(--s4)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);font-size:.9375rem;margin:0 0 var(--s3)}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px}
.notice.err{background:var(--late-wash);color:var(--late)}
.notice.offline{background:var(--tint);color:var(--ink)}
.banner .x{margin:-12px -10px -12px auto;width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;color:var(--ink-2);border-radius:50%}
.banner.quiet{align-items:center;flex-wrap:nowrap}

/* Controls */
.btn{border:1px solid var(--rule);background:var(--leaf);border-radius:999px;padding:10px 18px;font-weight:600;font-size:.94rem;min-height:44px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.btn.danger{color:var(--late)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.small{padding:6px 14px;font-size:.86rem;min-height:36px}
a.btn{text-decoration:none}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:.82rem;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r-sm);padding:10px 12px;width:100%;min-width:0;min-height:44px}
textarea{min-height:72px;resize:vertical}
.cmtform .btn{flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.toolbar{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
.toolbar input[type=search]{flex:1 1 200px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:var(--s4);scrollbar-width:none}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:6px 13px;font-size:.86rem;white-space:nowrap;color:var(--ink-2);min-height:34px;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink);border-color:var(--forest)}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:.84rem;border-radius:999px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.switch{display:flex;align-items:center;gap:var(--s3);font-size:.94rem}
.switch input{width:20px;height:20px;accent-color:var(--forest)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{display:flex;align-items:center;gap:5px;font-size:.86rem;border:1px solid var(--rule);border-radius:999px;padding:5px 10px}
.daypick input{accent-color:var(--forest)}
.cmtform{display:flex;gap:var(--s2)}
.cmtform input{flex:1}
.calbox{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);border-radius:var(--r);background:var(--tint)}
.calbox > b{font-weight:600}
.note{font-size:.86rem;color:var(--ink-2);margin:0}
.note.err{color:var(--late)}
.banner{display:flex;gap:var(--s2);align-items:baseline;flex-wrap:wrap;padding:var(--s3) 0;border-bottom:1px solid var(--rule);font-size:.92rem;color:var(--ink)}
.banner::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--soon);flex:none;transform:translateY(-2px)}
.confirm{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;font-size:.92rem}
.pill{font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--tint);color:var(--ink-2)}
.pill.late{background:var(--late-wash);color:var(--late)} .pill.soon{background:var(--soon-wash);color:var(--soon)} .pill.today{background:var(--forest-wash);color:var(--forest)}
.checked-by{font-size:.8rem;color:var(--ok);font-weight:600;white-space:nowrap}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--clay);color:#fff;font-size:.66rem;line-height:17px;font-weight:700}

/* Rooms grid (Home) */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s5) var(--s4);margin-bottom:var(--s6)}
.room{background:none;border:0;padding:0;text-align:start;color:inherit;display:flex;flex-direction:column;gap:4px}
.room b{font-family:var(--serif);font-weight:500;font-size:1.12rem}
.room span{font-size:.82rem;color:var(--ink-2)}

/* Feed and comments */
.feed{display:flex;flex-direction:column}
.feed .ev{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:start;padding:var(--s3) 0;border-bottom:1px solid var(--rule);font-size:.92rem}
.feed .ev.new b{color:var(--clay)}
.comments{display:flex;flex-direction:column;gap:var(--s3)}
.cmt{display:grid;grid-template-columns:auto 1fr;gap:var(--s2);font-size:.92rem}
.cmt .when{font-size:.76rem;color:var(--ink-3)}

/* Bottom navigation; becomes a sidebar on wide screens */
nav.tabs{position:fixed;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:680px}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--ink-3);position:relative;min-height:56px}
nav.tabs button[aria-current="page"]{color:var(--forest)}
nav.tabs svg{width:23px;height:23px}
nav.tabs .brand{display:none}

/* Sheets */

/* ---------- Dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const shiftDate=()=>{const d=new Date();if(d.getHours()<4)d.setDate(d.getDate()-1);return ymd(d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
function addInterval(s,t){
 const d=parse(s),n=Math.max(1,t.every|0);
 if(t.unit==="day")d.setDate(d.getDate()+n);
 else if(t.unit==="week")d.setDate(d.getDate()+7*n);
 else if(t.unit==="month"){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
 else d.setFullYear(d.getFullYear()+n);
 return ymd(d);
}
function onWeekday(s,wd){const d=parse(s);while(d.getDay()!==wd)d.setDate(d.getDate()+1);return ymd(d)}
// Seasonal tasks land on the first Saturday of their next allowed month (or stay put if already in one).
function snapSeason(s,months){
 if(!months||!months.length)return s;
 const d=parse(s);
 for(let i=0;i<24;i++){
  const m=d.getMonth()+1;
  if(months.includes(m)){
   if(i===0)return s;
   const f=new Date(d.getFullYear(),d.getMonth(),1);while(f.getDay()!==6)f.setDate(f.getDate()+1);return ymd(f);
  }
  d.setDate(1);d.setMonth(d.getMonth()+1);
 }
 return s;
}
function nextAfter(t,from){
 let n;
 if(t.flexible)n=addInterval(from,t);else{n=t.next;do{n=addInterval(n,t)}while(n<=from)}
 if(t.months&&t.months.length){
  // for seasonal tasks the interval is the minimum gap; then snap to the next allowed month
  const gap=t.months.length>1?Math.floor(12/t.months.length):12*Math.max(1,t.unit==="year"?t.every:1);
  const d=parse(from);d.setDate(1);d.setMonth(d.getMonth()+Math.max(1,gap-1));n=snapSeason(ymd(d),t.months);
 }
 if(t.unit==="week"&&t.weekday!=null&&!t.flexible)n=onWeekday(n,t.weekday);
 return n;
}
function nice(s){
 const diff=daysBetween(today(),s);
 if(diff===0)return"Today";if(diff===1)return"Tomorrow";if(diff===-1)return"Yesterday";
 const d=parse(s),o={weekday:"short",month:"short",day:"numeric"};if(d.getFullYear()!==new Date().getFullYear())o.year="numeric";
 return d.toLocaleDateString(undefined,o);
}
const clock=ms=>new Date(ms).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
function ago(ms){const m=Math.round((Date.now()-ms)/6e4);if(m<1)return"just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" hr ago";return new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
const t12=s=>{const [h,m]=(s||"21:00").split(":").map(Number);const d=new Date();d.setHours(h,m);return clock(d)};
function freqText(t){
 if(t.months&&t.months.length)return t.months.length===1?`Every ${MONTHS[t.months[0]-1]}`+(t.unit==="year"&&t.every>1?` · every ${t.every} yrs`:""):t.months.map(m=>MONTHS[m-1]).join(" & ");
 const n=t.every|0,u=t.unit;
 if(u==="day")return n===1?"Daily":`Every ${n} days`;
 if(u==="week")return(n===1?"Weekly":`Every ${n} weeks`)+(t.weekday!=null?` on ${DAYS[t.weekday].slice(0,3)}`:"");
 if(u==="month")return n===1?"Monthly":n===3?"Every 3 months":n===6?"Twice a year":n===12?"Yearly":`Every ${n} months`;
 return n===1?"Yearly":`Every ${n} years`;
}
const intervalDays=t=>t.months&&t.months.length?Math.round(365/t.months.length)*(t.unit==="year"?Math.max(1,t.every):1):({day:1,week:7,month:30,year:365}[t.unit])*Math.max(1,t.every|0);

 const v=ts.map(t=>{const total=intervalDays(t),left=daysBetween(today(),t.next);return Math.max(0,Math.min(1,left/total))});

}

 return b;

 const out=[];pos.sort((a,b)=>b[1]-a[1]);neg.sort((a,b)=>b[1]-a[1]);

 return out;
}

function formSheet(s){

  if(type==="pro")return `<label class="field"><span>${label}</span><select id="g-${k}" ${ro}><option value="">Did it ourselves</option>${Object.values(D.pros).map(p=>`<option value="${p.id}" ${p.id===v?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>`;
  if(type==="role")return `<label class="field"><span>${label}</span><select id="g-${k}" ${ro}><option value="kid" ${v==="kid"?"selected":""}>Kid (simple view, stars, needs OK)</option><option value="adult" ${v!=="kid"?"selected":""}>Adult</option></select></label>`;
  if(type==="color")return `<div class="field"><span>${label}</span><div class="chips" style="margin:0">${COLORS.map(c=>`<label class="chip" style="padding:4px"><input type="radio" name="g-color" value="${c}" ${c===(v||COLORS[0])?"checked":""} ${ro} style="accent-color:${c}"><span class="av" style="background:${c}"></span></label>`).join("")}</div></div>`;
  return `<label class="field"><span>${label}</span><input type="${type}" id="g-${k}" value="${esc(v??"")}" placeholder="${esc(ph||"")}" ${ro}></label>`;
 };
 let extra="";
 if(s.col==="things"&&s.id){

  if(d.manual)extra+=`<a class="linkish" href="${esc(d.manual)}" target="_blank" rel="noopener">Open the manual</a>`;
 }
 const photo=f.photo?`<div class="field"><span>Photo of the label or model plate</span>${d.photo?`<img src="${esc(photoUrl(d.photo))}" alt="Photo" style="max-width:220px;border-radius:8px">`:""}<input type="file" accept="image/*" id="g-photo"></div>`:"";
 return `<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-label="${f.title}"><div class="panel">

 </div></div>`;

async function saveForm(){
 const s=ui.sheet,f=FORMS[s.col],d=Object.assign({},s.data);delete d.id;
 for(const [k,,type] of f.fields){
  if(type==="people"){d[k]=[...document.querySelectorAll(`[data-gk="${k}"]:checked`)].map(x=>x.value);continue}
  if(type==="color"){const c=document.querySelector('input[name="g-color"]:checked');d[k]=c?c.value:COLORS[0];continue}
  const el=document.getElementById("g-"+k);if(!el)continue;
  if(type==="money")d[k]=Math.round(parseFloat(el.value||"0")*100);else if(type==="number")d[k]=el.value===""?"":Math.max(0,+el.value);else d[k]=el.value.trim();
 }
 const first=f.fields[0][0];if(!d[first]&&f.fields[0][2]!=="date"){document.getElementById("g-"+first)?.focus();return}
 if(s.col==="pros")d.rating=Math.min(5,d.rating|0);
 if(s.col==="rewards")d.cost=Math.max(1,d.cost|0);
 if(s.col==="expenses"&&!d.date)d.date=today();
 if(s.col==="service"&&!d.date)d.date=today();
 if(s.col==="info"&&!s.id)d.order=Date.now();
 const file=document.getElementById("g-photo")?.files?.[0];
 if(file&&S.photos){s.busy=true;renderLayer();
  try{d.photo=await uploadPhoto(file)}
  catch(e){s.busy=false;s.err=e&&e.code==="too_large"?"That photo is over 20 MB. Try a smaller one.":e&&e.code==="unsupported_type"?"Use a JPG, PNG, WEBP or GIF photo.":"Couldn't upload the photo. The rest wasn't saved yet; try again.";renderLayer();return}}
 const id=s.id||rid();put(s.col,id,d);
 if(s.col==="expenses"&&!s.id)logEvent({kind:"expense",text:`added an expense: ${d.what} ${money(d.amount)}`});
 if(s.col==="service"&&!s.id&&D.things[d.thing])logEvent({kind:"service",text:`logged service on the ${D.things[d.thing].name}: ${d.what}`});
 ui.sheet=null;toast("Saved");
}

function readDraft(){
 const d=ui.sheet.draft,v=id=>document.getElementById(id);if(!v("f-name"))return d;
 d.name=v("f-name").value.trim();d.room=v("f-room").value;d.mins=Math.max(1,+v("f-mins").value||15);d.every=Math.max(1,+v("f-every").value||1);d.unit=v("f-unit").value;

 d.rotate=[...document.querySelectorAll('[data-rot="task"]:checked')].map(x=>x.value);
 if(d.rotate.length>1&&!d.rotate.includes(d.assignee))d.assignee=d.rotate[0];
 d.months=[...document.querySelectorAll("[data-month]:checked")].map(x=>+x.dataset.month);
 d.next=v("f-next").value||today();d.time=v("f-time").value||"09:00";d.timeSet=!!d.timeSet||d.time!==(ME.defaultTime||"09:00");d.flexible=v("f-flex").checked;d.photoProof=v("f-photo").checked;

function openTask(id,mode){const t=D.tasks[id];if(!t)return;const d=JSON.parse(JSON.stringify(t));delete d.id;d.months=d.months||[];d.rotate=d.rotate||[];ui.sheet={kind:"task",id,draft:d,mode:mode||"view"};ui.calMsg=null;renderLayer();if(!ui.cal.list&&!ui.cal.err)loadCalendars()}
function saveTask(){
 const d=readDraft();if(!d.name){document.getElementById("f-name").focus();return}
 if(d.unit==="week"){if(d.weekday==null)d.weekday=parse(d.next).getDay();d.next=onWeekday(d.next,d.weekday)}else d.weekday=null;
 if(d.months.length)d.next=snapSeason(d.next,d.months);
 d.stepsDone=(d.stepsDone||[]).filter(i=>i<d.steps.length);
 const id=ui.sheet.isNew?rid():ui.sheet.id,prev=D.tasks[id];put("tasks",id,d);
 if(d.assignee&&d.assignee!==myPid()&&(!prev||prev.assignee!==d.assignee))logEvent({kind:"assign",text:`gave ${pName(d.assignee)} “${d.name}”`,ref:"task:"+id});
 if(ui.sheet.isNew){ui.sheet=null;toast(`Added · first due ${nice(d.next)}`)}else{openTask(id,"view");toast(`Saved · next ${nice(d.next)}`)}
}
function startDone(id,credit){

/* ---------- Shared: sub-navigation (changes the view) and folding groups ---------- */
function subnav(label,items,cur,attr){
 return `<nav class="subnav" aria-label="${esc(label)}">${items.map(([v,l])=>`<button data-${attr}="${v}" ${cur===v?'aria-current="page"':""}>${l}</button>`).join("")}</nav>`;
}
function fold(id,title,stamp,inner,defOpen,preview,cls=""){
 const open=ui.folds&&id in ui.folds?ui.folds[id]:defOpen;
 return `<details class="fold ${cls}" id="g-${id}" data-fold="${id}" ${open?"open":""}><summary><span class="f-head"><span class="f-title">${title}</span>${preview&&!open?`<span class="f-prev">${preview}</span>`:""}</span><span class="stamp">${stamp}</span>${IC.chevd}</summary><div class="f-body">${open?inner():""}</div></details>`;
}
const preview=l=>{const n=l.slice(0,2).map(t=>esc(t.name)).join(", ");return l.length>2?`${n} and ${l.length-2} more`:n};
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.fold){const prev=ui.folds&&ui.folds[d.dataset.fold];ui.folds=Object.assign({},ui.folds||{},{[d.dataset.fold]:d.open});if(!!prev!==d.open&&(d.open?!d.querySelector(".f-body").children.length:d.querySelector(".f-prev")===null)){const id=d.id;render();document.getElementById(id)?.querySelector("summary")?.focus({preventScroll:true})}}},true);
function jumpTo(id){if(id!=="routines")ui.folds=Object.assign({},ui.folds||{},{[id]:true});render();const el=document.getElementById("g-"+id);if(el){el.scrollIntoView({block:"start",behavior:reduced()?"auto":"smooth"});el.querySelector("summary,h2")?.focus({preventScroll:true})}}

/* ---------- Schedule: the next two weeks open, later months folded, seasons by season ---------- */
const dayLabel=d=>{const n=daysBetween(today(),d);return n===1?"Tomorrow":parse(d).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})};
function byDay(list,openFirst){
 const g={};list.forEach(t=>(g[t.next]=g[t.next]||[]).push(t));
 return Object.keys(g).sort().map((k,i)=>fold("d"+k,dayLabel(k),`${g[k].length} · ${fmtMins(g[k].reduce((a,t)=>a+(t.mins|0),0))}`,()=>`<div class="list">${g[k].map(t=>taskRow(t,{due:false})).join("")}</div>`,openFirst&&i===0,preview(g[k]),"day")).join("");
}
function routinesSection(){
 const rs=routines();
 const rows=rs.map(r=>{const done=r.items.filter(i=>D.checks[checkId(r.id,i.id)]).length,days=r.days||[0,1,2,3,4,5,6];
  return `<button class="row link" data-openroutine="${r.id}"><span class="main"><span class="name">${esc(r.name)}</span><span class="meta"><span>${days.length===7?"Every night":days.map(d=>DAYS[d].slice(0,3)).join(", ")} at ${t12(r.time)}</span><span>${r.items.length} item${r.items.length===1?"":"s"}</span>${routineRunsTonight(r)?`<span>${done} of ${r.items.length} done tonight</span>`:""}</span></span>${IC.chev}</button>`}).join("");
 return `<section class="group" id="g-routines"><div class="group-head"><h2>Routines</h2>${S.canWrite&&rs.length?`<button class="linkish" data-newroutine="1">New routine</button>`:""}</div>
 ${rs.length?`<div class="list">${rows}</div>`:`<div class="empty"><strong>No routines yet.</strong>A closing shift is the short list everyone runs before bed.${S.canWrite?`<div class="btn-row"><button class="btn" data-mkclosing="1">Start a closing shift</button><button class="linkish" data-newroutine="1">New routine</button></div>`:""}</div>`}</section>`;
}
function viewSchedule(){
 if(ui.schedView==="routines")ui.schedView="upcoming";
 const nav=subnav("Schedule views",[["upcoming","Upcoming"],["seasonal","By season"]],ui.schedView,"sv");
 let body="",index=[];
 if(ui.schedView==="upcoming"){
  const t0=today(),w1=addDays(t0,7),w2=addDays(t0,14),y1=addDays(t0,366);
  const ts=tasks().filter(t=>passWho(t)&&t.next>t0&&t.next<=y1).sort((a,b)=>a.next.localeCompare(b.next)||a.name.localeCompare(b.name));
  const wk=ts.filter(t=>t.next<=w1),nx=ts.filter(t=>t.next>w1&&t.next<=w2),later=ts.filter(t=>t.next>w2);
  const mins=l=>fmtMins(l.reduce((a,t)=>a+(t.mins|0),0));
  const months={};later.forEach(t=>{const k=t.next.slice(0,7);(months[k]=months[k]||[]).push(t)});
  const thisMonth=t0.slice(0,7);
  const mName=k=>{const [y,m]=k.split("-").map(Number),d=new Date(y,m-1,1);const n=d.toLocaleDateString(undefined,{month:"long",year:y!==new Date().getFullYear()?"numeric":undefined});return k===thisMonth?`Later in ${d.toLocaleDateString(undefined,{month:"long"})}`:n};
  if(nx.length)index.push(["next","Week after"]);
  Object.keys(months).sort().forEach(k=>{const [y,m]=k.split("-").map(Number);index.push(["m"+k,new Date(y,m-1,1).toLocaleDateString(undefined,{month:"short"})+(y!==new Date().getFullYear()?" ’"+String(y).slice(2):"")])});
  index.push(["routines","Routines"]);
  body=`${ts.length?`<p class="summary">Next 7 days: <b>${wk.length} task${wk.length===1?"":"s"}</b>, about ${mins(wk)}. Today's tasks are on Today.</p>`:""}
  <nav class="jump" aria-label="Jump to"><span>Jump to</span>${index.map(([id,l])=>`<button data-jump="${id}">${esc(l)}</button>`).join("")}</nav>
  ${wk.length?`<section class="group" id="g-week"><div class="group-head"><h2>Next 7 days</h2><span class="stamp">${wk.length} · ${mins(wk)}</span></div>${byDay(wk,true)}</section>`:""}
  ${nx.length||Object.keys(months).length?`<section class="group"><div class="group-head"><h2>Later</h2></div>`:""}
  ${nx.length?fold("next","The week after",`${nx.length} · ${mins(nx)}`,()=>`<div class="list">${nx.map(t=>taskRow(t)).join("")}</div>`,false,preview(nx)):""}
  ${Object.keys(months).sort().map(k=>fold("m"+k,mName(k),`${months[k].length} task${months[k].length===1?"":"s"}`,()=>`<div class="list">${months[k].map(t=>taskRow(t)).join("")}</div>`,false,preview(months[k]))).join("")}
  ${nx.length||Object.keys(months).length?`</section>`:""}
  ${!ts.length?`<div class="empty"><strong>Nothing else on the schedule.</strong>Add tasks from Home → Library.</div>`:""}
  ${routinesSection()}`;
 }else{
  const cur=seasonNow(),order=[...Array(4)].map((_,i)=>SEASONS[(SEASONS.findIndex(s=>s[0]===cur.name)+i)%4]);
  const long=tasks().filter(t=>passWho(t)&&!(t.months&&t.months.length)&&(t.unit==="year"||(t.unit==="month"&&t.every>=3)));
  const y1=addDays(today(),366);
  body=`<p class="summary">Seasonal jobs and the bigger ones that come around once or a few times a year.</p>`+order.map(([name,ms],i)=>{
   const list=tasks().filter(t=>passWho(t)&&t.months&&t.months.some(m=>ms.includes(m)));
   const big=long.filter(t=>(i===0?t.next<=cur.end:t.next<=y1)&&ms.includes(parse(t.next).getMonth()+1));
   const all=[...list,...big];if(!all.length)return"";
   if(i===0){const st=seasonTasks();const left=st.left.filter(passWho),done=st.done.filter(passWho);
    return `<section class="group" id="g-s${name}"><div class="group-head"><h2>${name} checklist</h2><span class="stamp">${done.length} of ${list.length} done</span></div><p class="more-note">This season runs through ${nice(cur.end)}.</p><span class="meter wide" aria-hidden="true"><i style="width:${list.length?done.length/list.length*100:0}%"></i></span>${left.length?`<div class="list">${left.sort((a,b)=>a.next.localeCompare(b.next)).map(t=>taskRow(t)).join("")}</div>`:`<p class="caught-line">The ${name.toLowerCase()} checklist is done.</p>`}
    ${big.length?fold("sbig",`Other big jobs before ${nice(cur.end)}`,`${big.length}`,()=>`<div class="list">${big.sort((a,b)=>a.next.localeCompare(b.next)).map(t=>taskRow(t)).join("")}</div>`,false,preview(big)):""}
    ${done.length?fold("sdone","Done this season",`${done.length}`,()=>`<div class="list">${done.map(t=>`<div class="row"><span class="main"><span class="name done-name">${esc(t.name)}</span><span class="meta"><span class="checked-by">${IC.tick}Done ${nice(t.lastDone)}${t.lastBy?" · "+esc(pShort(t.lastBy)):""}</span></span></span><span></span></div>`).join("")}</div>`,false):""}</section>${order.length>1?`<div class="group-head next-seasons"><h2>Later seasons</h2></div>`:""}`}
   return fold("s"+name,name,`${all.length} task${all.length===1?"":"s"}`,()=>`<div class="list">${all.sort((a,b)=>a.next.localeCompare(b.next)).map(t=>taskRow(t)).join("")}</div>`,false,preview(all));
  }).join("");
 }
 return `<header class="top"><div class="ttl"><h1>Schedule</h1><span class="date">${tasks().length} recurring tasks</span></div></header>${nav}${whoSeg()?`<div class="filter-row">${whoSeg()}</div>`:""}${body}`;
}
function viewHome(){
 const seg=`<div class="seg" role="group" aria-label="Section">${[["rooms","Rooms"],["library","Library"],["things","Appliances"],["pros","Contractors"],["info","Home info"]].map(([v,l])=>`<button data-hv2="${v}" aria-pressed="${ui.homeView===v}">${l}</button>`).join("")}</div>`;
 let body="";
 if(ui.homeView==="rooms"){
  if(ui.roomOpen){
   const r=ui.roomOpen,ts=tasks().filter(t=>t.room===r).sort((a,b)=>a.next.localeCompare(b.next)),f=freshness(r);
   body=`<button class="linkish" data-roomopen="">← All rooms</button><section class="group" style="margin-top:var(--s4)"><div class="group-head"><h2>${esc(r)}</h2><span class="stamp">${f==null?"":Math.round(f*100)+"% fresh"}</span></div><div class="list">${ts.map(taskRow).join("")||`<div class="empty">No tasks here yet.</div>`}</div></section>${S.canWrite?`<button class="btn" data-new="1">New task</button>`:""}`;
  }else{

    return `<button class="room" data-roomopen="${esc(r)}"><b>${esc(r)}</b><span>${ts.length} task${ts.length>1?"s":""}${due?` · ${due} due`:""}</span><span class="progress fresh" style="margin:2px 0 0"><i style="width:${Math.round((f||0)*100)}%"></i></span></button>`}).join("")}</div>${S.canWrite?`<button class="btn" data-new="1">New task</button>`:""}`;

  const rooms=["All",...ROOMS.filter(r=>LIB.some(l=>l.room===r))];
  body=`<div class="toolbar"><input type="search" id="q" placeholder="Search the maintenance library" value="${esc(ui.q)}"><div class="seg"><button data-libfit="1" aria-pressed="${fitOnly}">Suggested for you</button><button data-libfit="0" aria-pressed="${!fitOnly}">Everything</button></div></div>
  <div class="chips">${rooms.map(r=>`<button class="chip" data-libroom="${esc(r)}" aria-pressed="${ui.libRoom===r}">${esc(r)}</button>`).join("")}</div>
  ${fitOnly&&items.length&&S.canWrite?`<p class="note" style="margin-bottom:var(--s3)">${items.length} tasks fit your home and aren't added yet. <button class="linkish" data-addall="1">Add all</button></p>`:""}
  <div class="list">${items.map(l=>`<div class="row"><div class="main"><span class="name">${esc(l.name)}</span><span class="meta"><span>${esc(l.room)}</span><span>${freqText(l)}</span><span>${l.mins} min</span>${l.steps.length?`<span>${l.steps.length}-step checklist</span>`:""}</span></div>${have.has(l.lib)?`<span class="pill">Added</span>`:`<button class="btn small" data-add="${l.lib}">Add</button>`}</div>`).join("")||`<div class="empty">${fitOnly?"Everything that fits your home is already added.":"Nothing matches."}</div>`}</div>`;
 }else body={things:moreThings,pros:morePros,info:moreInfo}[ui.homeView]();
 return `<header class="top"><div><span class="eyebrow">Maintenance and records</span><h1>Home</h1></div></header>${seg}<div style="height:var(--s5)"></div>${body}`;

/* ---------- Interaction: completion moment, swipe, haptics, kid chime ---------- */
const haptic=(ms=8)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
let audioCtx=null;
function chime(){
 if(ME.kidSound===false)return;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
  [660,880].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.09);g.gain.linearRampToValueAtTime(.12,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.35);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.09);o.stop(t+i*.09+.4)})}catch(e){}
}
const reduced=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function moveTomorrow(id){const t=D.tasks[id];if(!t)return;const prev=t.next;patch("tasks",id,{next:addDays(today(),1)});toast(`Moved to tomorrow`,()=>patch("tasks",id,{next:prev}))}
function skipOnce(id){const t=D.tasks[id];if(!t)return;const prev=t.next;const n=nextAfter(t,today());patch("tasks",id,{next:n});toast(`Skipped · next ${nice(n)}`,()=>patch("tasks",id,{next:prev}))}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const ds=b.dataset;
 if(swipeState.blockClick){e.stopImmediatePropagation();e.preventDefault();swipeState.blockClick=false;return}
 if(ds.done&&!b.closest(".sheet")){
  const t=D.tasks[ds.done];if(!t||!S.canWrite)return;
  e.stopImmediatePropagation();haptic(10);
  if(t.photoProof){startDone(ds.done);return}
  const row=b.closest(".row");if(row&&!reduced()){row.classList.add("completing");setTimeout(()=>row.classList.add("gone"),20)}
  setTimeout(()=>startDone(ds.done),reduced()?0:420);return;
 }
 if(ds.tick||ds.kidtick){haptic(10);if(ds.kidtick)chime();
  setTimeout(()=>{const r=routines().find(x=>x.id===ui.routine)||routines().find(routineRunsTonight);if(r){const all=r.items.length,done=r.items.filter(i=>D.checks[checkId(r.id,i.id)]).length;if(all&&done===all){haptic([12,60,12]);toast("That's the house closed for the night.")}}},60);return}
 if(ds.kiddone){haptic(10);chime();setTimeout(()=>{const s=document.querySelector(".kidstars");if(s){s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop")}},80);return}
 if(ds.done&&b.closest(".sheet")){e.stopImmediatePropagation();const id=ds.done;ui.sheet=null;renderLayer();startDone(id);return}
 if(ds.claim&&b.closest(".sheet")){e.stopImmediatePropagation();claim(ds.claim);if(ui.sheet&&ui.sheet.draft)ui.sheet.draft.assignee=myPid();renderLayer();toast("It's yours now");return}
 if(ds.editmode){e.stopImmediatePropagation();ui.sheet.mode="edit";renderLayer();return}
 if(ds.viewmode){e.stopImmediatePropagation();openTask(ui.sheet.id,"view");return}
 if(ds.tomorrow){e.stopImmediatePropagation();if(ui.sheet)ui.sheet=null;moveTomorrow(ds.tomorrow);return}
 if(ds.skip){e.stopImmediatePropagation();if(ui.sheet)ui.sheet=null;skipOnce(ds.skip);return}
 if(ds.prepopen){e.stopImmediatePropagation();const a=wxAlert();ui.prepOpen=Object.assign({},ui.prepOpen||{},{[ds.prepopen]:!(ui.prepOpen&&ds.prepopen in ui.prepOpen?ui.prepOpen[ds.prepopen]:a&&a.day<=1)});render();return}
 if(ds.dismiss){e.stopImmediatePropagation();ME.dismissed=Object.assign({},ME.dismissed||{},{[ds.dismiss]:Date.now()});saveMe();return}
 if(ds.claim&&b.closest(".acts")){e.stopImmediatePropagation();closeSwipe();claim(ds.claim);return}
 if(ds.jump){e.stopImmediatePropagation();jumpTo(ds.jump);return}
 if(ds.sv){e.stopImmediatePropagation();ui.schedView=ds.sv;render();return}
 if(ds.hv2){e.stopImmediatePropagation();ui.homeView=ds.hv2;ui.q="";ui.roomOpen=null;render();return}
 if(ds.roomopen!=null){e.stopImmediatePropagation();ui.roomOpen=ds.roomopen||null;render();window.scrollTo(0,0);return}
 if(ds.libfit){e.stopImmediatePropagation();ui.libFit=ds.libfit==="1";render();return}
 if(ds.openroutine){e.stopImmediatePropagation();ui.routine=ds.openroutine;ui.tab="shift";ui.editShift=false;render();window.scrollTo(0,0);return}
},true);
const actsWidth=row=>{const a=row.parentNode&&row.parentNode.querySelector(".acts");return a?a.offsetWidth:170};
const swipeState={el:null,x:0,y:0,dx:0,open:null,blockClick:false,moved:false};
function closeSwipe(){if(swipeState.open){swipeState.open.style.transform="";swipeState.open=null}}
document.addEventListener("pointerdown",e=>{
 const row=e.target.closest(".swipe > .row");if(!row||ui.arranging||e.pointerType==="mouse"&&e.button!==0)return;
 if(swipeState.open&&swipeState.open!==row)closeSwipe();
 Object.assign(swipeState,{el:row,x:e.clientX,y:e.clientY,dx:0,moved:false});
});
document.addEventListener("pointermove",e=>{
 const s=swipeState;if(!s.el)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;
 if(!s.moved&&Math.abs(dy)>Math.abs(dx))return;
 if(Math.abs(dx)>8){s.moved=true}
 if(!s.moved)return;
 const w=actsWidth(s.el),base=s.open===s.el?-w:0;s.dx=Math.min(0,Math.max(-(w+20),base+dx));
 s.el.style.transition="none";s.el.style.transform=`translateX(${s.dx}px)`;
});
document.addEventListener("pointerup",()=>{
 const s=swipeState;if(!s.el)return;s.el.style.transition="";
 if(s.moved){s.blockClick=true;setTimeout(()=>s.blockClick=false,350);
  if(s.dx<-70){s.el.style.transform=`translateX(-${actsWidth(s.el)}px)`;s.open=s.el;haptic(6)}else{s.el.style.transform="";if(s.open===s.el)s.open=null}}
 s.el=null;
});
document.addEventListener("pointercancel",()=>{if(swipeState.el){swipeState.el.style.transform="";swipeState.el=null}});

/* Background re-renders (sync, polling) must not rebuild an open sheet, or typed input is lost. */
function toastHtml(){return ui.toast?`<div class="toast" role="status"><span>${esc(ui.toast.msg)}</span>${ui.toast.undo?'<button data-undo="1">Undo</button>':""}</div>`:""}
function renderToastOnly(){layer.querySelectorAll(".toast").forEach(x=>x.remove());if(ui.toast)layer.insertAdjacentHTML("beforeend",toastHtml())}
function softLayer(){if(ui.sheet&&layer._sheet===ui.sheet&&layer.querySelector(".sheet")){renderToastOnly();return}renderLayer()}
function toast(msg,undo){ui.toast={msg,undo};clearTimeout(toastTimer);toastTimer=setTimeout(()=>{ui.toast=null;renderToastOnly()},5500);renderToastOnly()}

function viewShift(){
 const rs=routines();
 if(!rs.length)return `<button class="linkish" data-tab="today">← Today</button><header class="top" style="margin-top:var(--s4)"><div><span class="eyebrow">Routines</span><h1>Closing shift</h1></div></header>${banners()}<div class="caught"><span class="big">No closing shift yet.</span><span class="muted">It's the short list the household runs before bed, each person with their own part.</span></div>${S.canWrite?`<div style="margin-top:var(--s4)"><button class="btn primary" data-mkclosing="1">Start a closing shift</button></div>`:""}`;
 if(!ui.routine||!D.routines[ui.routine])ui.routine=(rs.find(routineRunsTonight)||rs[0]).id;
 const r=D.routines[ui.routine],done=r.items.filter(i=>D.checks[checkId(r.id,i.id)]).length,all=r.items.length,closed=all&&done===all;
 const chips=`<div class="chips">${rs.map(x=>`<button class="chip" data-routine="${x.id}" aria-pressed="${x.id===r.id}">${esc(x.name)}</button>`).join("")}${S.canWrite?`<button class="chip" data-newroutine="1">New routine</button>`:""}</div>`;
 if(ui.editShift)return viewShiftEdit(r,chips);
 const me=myPid(),order=[...r.items].sort((a,b)=>(a.assignee===me?0:1)-(b.assignee===me?0:1));
 return `<button class="linkish" data-tab="today">← Today</button>
 <header class="top" style="margin-top:var(--s4)"><div><span class="eyebrow">${routineRunsTonight(r)?`Tonight · ${t12(r.time)}`:"Not scheduled tonight"}</span><h1>${closed?"Closed for the night":esc(r.name)}</h1></div>${S.canWrite?`<button class="btn small" data-editshift="1">Edit</button>`:""}</header>${banners()}
 ${rs.length>1?chips:""}
 <div class="progress"><i style="width:${all?done/all*100:0}%"></i></div>
 <p class="note" style="margin-bottom:var(--s4)">${done} of ${all} done${closed?". Nice work, everyone.":""} · Resets at 4 AM</p>
 <div class="list" data-sort="shift:${r.id}">${order.map(i=>{const c=D.checks[checkId(r.id,i.id)],nc=commentsFor("item:"+r.id+":"+i.id).length,pend=c&&Object.values(D.approvals).some(a=>a.ref===c.id);
  return `<div class="row task" data-row="${i.id}"><button class="main" data-item="${i.id}"><span class="name" ${c?'style="color:var(--ink-2)"':""}>${esc(i.text)}</span>
   ${i.standard&&!c?`<span class="std"><b>Done means:</b> ${esc(i.standard)}</span>`:""}

/* Focus: move into a sheet when it opens, keep it there, and return it to what opened it */
let sheetOpener=null;
function selectorFor(el){if(!el||!el.dataset)return null;const k=Object.keys(el.dataset)[0];return k?`[data-${k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())}="${CSS.escape(el.dataset[k])}"]`:null}
function afterLayer(prev){
 const now=layer.querySelector(".sheet");
 if(now&&!prev){sheetOpener=selectorFor(document.activeElement);(now.querySelector("[data-autofocus]")||now.querySelector(".sheet-title,h2")||now).focus?.({preventScroll:true})}
 else if(now&&prev&&layer._mode!==(ui.sheet&&ui.sheet.mode)){(now.querySelector(".sheet-title")||now).focus?.({preventScroll:true})}
 else if(!now&&prev&&sheetOpener){const el=document.querySelector(sheetOpener);if(el)el.focus({preventScroll:true});sheetOpener=null}
 layer._mode=ui.sheet&&ui.sheet.mode;
}
document.addEventListener("keydown",e=>{
 if(e.key!=="Tab")return;const sh=layer.querySelector(".sheet")||document.querySelector("#pinwrap .sheet");if(!sh)return;
 const f=[...sh.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;
 const first=f[0],last=f[f.length-1];
 if(!sh.contains(document.activeElement)){e.preventDefault();first.focus();return}
 if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});

/* Seasons */
const SEASONS=[["Winter",[12,1,2]],["Spring",[3,4,5]],["Summer",[6,7,8]],["Fall",[9,10,11]]];
function seasonNow(){
 const d=new Date(),m=d.getMonth()+1,s=SEASONS.find(x=>x[1].includes(m));
 let y=d.getFullYear();const startMonth=s[1][0];const startYear=(s[0]==="Winter"&&m<=2)?y-1:y;
 const start=ymd(new Date(startYear,startMonth-1,1));const endM=s[1][2];const endY=s[0]==="Winter"?startYear+1:startYear;
 const end=ymd(new Date(endY,endM,0));
 return{name:s[0],months:s[1],start,end,key:`season-${startYear}-${s[0].toLowerCase()}`};
}
function seasonTasks(){
 const s=seasonNow();
 const list=tasks().filter(t=>t.months&&t.months.some(m=>s.months.includes(m)));
 const done=list.filter(t=>t.lastDone&&t.lastDone>=s.start),left=list.filter(t=>!(t.lastDone&&t.lastDone>=s.start));
 return{s,list,done,left};
}

/* Milestones: recorded once per house */
const MILESTONE_TEXT={
 "tasks-25":"completed 25 tasks together","tasks-100":"completed 100 tasks together","tasks-250":"completed 250 tasks together","tasks-500":"completed 500 tasks together",
 "shift-7":"closed the house 7 nights in a row","shift-30":"closed the house 30 nights in a row","shift-100":"closed the house 100 nights in a row"
};
function shiftStreak(){
 const days=new Set(Object.values(D.activity).filter(a=>a.kind==="shift").map(a=>ymd(new Date(a.at-4*3600e3))));
 let d=shiftDate(),n=0;if(!days.has(d))d=addDays(d,-1);while(days.has(d)){n++;d=addDays(d,-1)}return n;
}
let msBusy=false;
function checkMilestones(){
 if(msBusy||!D.house||!D.house.setupDone||S.mode!=="db"||!S.canWrite)return;
 const have=D.house.milestones||{},hit=[];
 const total=Object.values(D.activity).filter(a=>a.kind==="task"&&!a.pending).length;
 [25,100,250,500].forEach(n=>{if(total>=n&&!have["tasks-"+n])hit.push("tasks-"+n)});
 const st=shiftStreak();[7,30,100].forEach(n=>{if(st>=n&&!have["shift-"+n])hit.push("shift-"+n)});
 const {s,list,left}=seasonTasks();if(list.length>=3&&!left.length&&!have[s.key])hit.push(s.key);
 if(!hit.length)return;
 msBusy=true;const m=Object.assign({},have);hit.forEach(k=>m[k]=Date.now());putHouse({milestones:m});
 hit.forEach(k=>{const text=MILESTONE_TEXT[k]||`finished the ${s.name} checklist`;logEvent({kind:"milestone",text,who:""})});
 const last=hit[hit.length-1];toast(last.startsWith("season")?`${s.name} checklist complete. The house is ready for the season.`:`Milestone: the household ${MILESTONE_TEXT[last]}.`);
 haptic&&haptic([10,50,10]);setTimeout(()=>msBusy=false,1500);
}

}
function viewHousehold(){
 const html=viewFamily().replace("<h1>Family</h1>","<h1>Household</h1>");
 const at=html.indexOf('<section class="group"><div class="group-head"><h2>What\'s new');
 const withMs=at>0?html.slice(0,at)+milestonesBlock()+html.slice(at):html+milestonesBlock();
 return withMs+`<section class="group"><div class="group-head"><h2>Kids, stars and rewards</h2></div><div style="height:var(--s3)"></div>${moreKids()}</section>`;
}

/* Freeze and storm prep (Open-Meteo, no key) */
const PREP={
 freeze:["Drip faucets on outside walls","Open cabinet doors under sinks","Disconnect and drain outdoor hoses","Cover or bring in tender plants","Keep the heat at 55°F or higher, even if you're away","Check generator fuel and extension cords"],
 storm:["Charge phones and power banks","Test the generator and check its fuel","Secure or bring in outdoor furniture and trash cans","Find flashlights and fresh batteries","Fill a few jugs of water","Clear gutters and drains near the house"],
 snow:["Stock salt or ice melt and find the shovels","Fill the car's gas tank","Charge phones and power banks","Test the generator and check its fuel","Drip faucets on outside walls","Clear snow from vents and meters after it stops"],
 heat:["Check the AC filter","Close blinds on the sunny side","Check on pets' water and shade","Water the garden early in the morning"]
};
function wxCache(){try{return JSON.parse(localStorage.getItem("upkeep-wx")||"null")}catch(e){return null}}
async function loadForecast(force){
 const pl=D.house&&D.house.place;if(!pl)return null;
 const c=wxCache();if(!force&&c&&c.lat===pl.lat&&Date.now()-c.at<3*3600e3)return c;
 try{
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${pl.lat}&longitude=${pl.lon}&daily=temperature_2m_min,temperature_2m_max,wind_gusts_10m_max,snowfall_sum,precipitation_sum&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=4`;
  const r=await fetch(u);if(!r.ok)return c;const j=await r.json();
  const out={at:Date.now(),lat:pl.lat,daily:j.daily};localStorage.setItem("upkeep-wx",JSON.stringify(out));return out;
 }catch(e){return c}
}
function wxAlert(){
 const c=wxCache();if(!c||!c.daily||!c.daily.time)return null;
 const d=c.daily,dayName=i=>i===0?"tonight":i===1?"tomorrow night":new Date(d.time[i]+"T12:00").toLocaleDateString(undefined,{weekday:"long"})+" night";
 const dayName2=i=>i===0?"today":i===1?"tomorrow":new Date(d.time[i]+"T12:00").toLocaleDateString(undefined,{weekday:"long"});
 for(let i=0;i<d.time.length;i++){
  const base={day:i};
  if((d.snowfall_sum[i]||0)>=2)return Object.assign(base,{kind:"snow",key:"snow-"+d.time[i],title:`About ${Math.round(d.snowfall_sum[i])}" of snow ${dayName2(i)}`});
  if((d.wind_gusts_10m_max[i]||0)>=45)return Object.assign(base,{kind:"storm",key:"storm-"+d.time[i],title:`Gusts up to ${Math.round(d.wind_gusts_10m_max[i])} mph ${dayName2(i)}`});
  if((d.precipitation_sum[i]||0)>=2)return Object.assign(base,{kind:"storm",key:"storm-"+d.time[i],title:`About ${d.precipitation_sum[i].toFixed(1)}" of rain ${dayName2(i)}`});
  if((d.temperature_2m_min[i]??99)<=25)return Object.assign(base,{kind:"freeze",key:"freeze-"+d.time[i],title:`Hard freeze ${dayName(i)}, low of ${Math.round(d.temperature_2m_min[i])}°F`});
  if((d.temperature_2m_max[i]??0)>=95)return Object.assign(base,{kind:"heat",key:"heat-"+d.time[i],title:`Heat ${dayName2(i)}, high of ${Math.round(d.temperature_2m_max[i])}°F`});
 }
 return null;
}
function liveNotice(a){
 const text=`${pName(a.actor||a.who)} ${a.text}`;toast(text);
 if(ME.notify&&document.hidden&&"Notification" in window&&Notification.permission==="granted"){try{navigator.serviceWorker?.ready.then(r=>r.showNotification("Upkeep",{body:text,icon:"/icon-192.png",tag:a.id})).catch(()=>{})}catch(e){}}
}
async function findPlace(q){
 const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=en&countryCode=US`);
 if(!r.ok)throw new Error("geo");const j=await r.json();return(j.results||[]).map(x=>({name:`${x.name}${x.admin1?", "+x.admin1:""}`,lat:+x.latitude.toFixed(3),lon:+x.longitude.toFixed(3)}));
}

/* Kid view lock */
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("upkeep:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const pinLayer=document.createElement("div");document.body.appendChild(pinLayer);
function showPin(onOk){
 ui.pin={entry:"",onOk,err:""};drawPin();
}
function drawPin(){
 const p=ui.pin;if(!p){pinLayer.innerHTML="";return}
 pinLayer.innerHTML=`<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Enter PIN"><div class="panel" style="align-items:center;max-width:380px">
 <h2>Grown-ups only</h2><p class="note">Enter the PIN to leave Kid view.</p>
 <div class="pindots" aria-live="polite">${[0,1,2,3].map(i=>`<i class="${i<p.entry.length?"on":""}"></i>`).join("")}</div>
 ${p.err?`<p class="note err">${esc(p.err)}</p>`:""}
 <div class="pinpad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-pinkey="${k}" aria-label="${k==="⌫"?"Delete":k}">${k}</button>`).join("")}</div>
 <button class="linkish" data-pincancel="1">Cancel</button></div></div>`;
}

/* Settings (adds backup, Kid view lock, location; keeps the earlier sections) */
function moreSettings(){
 const pr=(D.house&&D.house.profile)||{},h=D.house||{};
 const canNotify="Notification" in window;
 return `<section class="group"><div class="calbox"><b>Away mode</b><p class="note">Going on a trip? Turn this on and nothing goes overdue. When you're back, every due date moves forward by the days you were gone.</p>${paused()?`<button class="btn primary" data-unpause="1">I'm back</button>`:`<div><button class="btn" data-pause="1">Turn on Away mode</button></div>`}</div></section>
 <section class="group"><div class="calbox"><b>Freeze and storm reminders</b><p class="note">With your town set, Upkeep checks the forecast and shows a short prep list before a hard freeze, heavy snow, high winds or a big storm.</p>
 ${h.place?`<p style="margin:0">${esc(h.place.name)} <button class="linkish" data-placeclear="1">Change</button></p>`:`<div class="cmtform"><input type="text" id="place-q" placeholder="Town, e.g. Andrews NC" autocomplete="address-level2"><button class="btn" data-placefind="1">Find</button></div>${ui.places?ui.places.length?`<div class="list">${ui.places.map((p,i)=>`<button class="row" data-placepick="${i}"><span class="main"><span class="name">${esc(p.name)}</span></span><span class="linkish">Use</span></button>`).join("")}</div>`:`<p class="note">No towns found. Try the town name without the ZIP.</p>`:""}`}</div></section>
 <section class="group"><div class="calbox"><b>Notifications on this device</b><p class="note">A notice when someone completes something, checks a shift item, comments or nudges you, and before bad weather. On iPhone, add Upkeep to your Home Screen first (Share → Add to Home Screen).</p>${canNotify?`<label class="switch"><input type="checkbox" id="notify" ${ME.notify&&Notification.permission==="granted"?"checked":""}><span>Show notifications</span></label>${Notification.permission==="denied"?`<p class="note err">Notifications are blocked for Upkeep in this browser's settings.</p>`:""}`:`<p class="note">This browser doesn't support notifications.</p>`}</div></section>
 <section class="group"><div class="calbox"><b>Kid view</b><p class="note">A PIN keeps kids from leaving Kid view on a shared tablet. It's the same PIN on every device in the house.</p>
 ${h.kidPin?`<p style="margin:0">PIN is on.</p>`:""}
 <div class="cmtform"><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pin-new" placeholder="${h.kidPin?"New 4-digit PIN":"4-digit PIN"}" autocomplete="off"><button class="btn" data-pinset="1">${h.kidPin?"Change":"Set PIN"}</button></div>
 ${h.kidPin?`<button class="linkish" data-pinclear="1">Turn off the PIN</button>`:""}
 <label class="switch"><input type="checkbox" id="kiddevice" ${ME.kidDevice?"checked":""}><span>Open this device straight into Kid view</span></label>
 <label class="switch"><input type="checkbox" id="kidsound" ${ME.kidSound!==false?"checked":""}><span>Soft sound when a kid completes something</span></label></div></section>
 <section class="group"><div class="group-head"><h2>Your home</h2></div><div style="height:var(--s3)"></div>${profileForm(pr)}<p class="note" style="margin-top:var(--s2)">Changing this updates Home → Library → Suggested for you. It doesn't remove tasks you already have.</p></section>
 <section class="group"><div class="calbox"><b>Backup</b><p class="note">Save everything in this house to a file: tasks, routines, people, history, records and lists. Photos stay online and are linked from the backup.</p>
 <div style="display:flex;gap:var(--s2);flex-wrap:wrap"><button class="btn small" data-backup="1">Download backup</button><button class="btn small" data-csv="1">Tasks as a spreadsheet (CSV)</button><label class="btn small" style="cursor:pointer">Restore from backup<input type="file" accept="application/json,.json" id="restore-file" hidden></label></div>
 ${ui.restore?`<div class="confirm">Replace everything in this house with the backup from ${esc(ui.restore.when)}? (${ui.restore.count} items) Everyone in the house will see the restored version. <button class="btn small danger" data-restore="1">Replace</button><button class="btn small" data-restore="0">Cancel</button></div>`:""}</div></section>
 <section class="group"><div class="calbox"><b>This phone</b><p class="note">Signed in as ${esc(pName(myPid()))}. ${S.ops.length?`${S.ops.length} change${S.ops.length>1?"s":""} waiting to sync.`:"Everything is synced."}</p><div style="display:flex;gap:var(--s2);flex-wrap:wrap"><button class="btn small" data-switchme="1">I'm someone else</button>${ui.confirmLeave?`<span class="confirm">Leave this house on this phone? <button class="btn small danger" data-leave="2">Leave</button><button class="btn small" data-leave="0">Stay</button></span>`:`<button class="btn small danger" data-leave="1">Leave this house</button>`}</div></div></section>`;
}
function downloadFile(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function backupJson(){
 const docs={house:{main:D.house}};COLS.forEach(c=>{docs[c]={};Object.values(D[c]).forEach(d=>{const x=Object.assign({},d);delete x.id;docs[c][d.id]=x})});
 return JSON.stringify({app:"upkeep",version:1,exported:new Date().toISOString(),docs},null,1);
}
function tasksCsv(){
 const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
 const rows=[["Task","Room","Repeats","Next due","Last done","Whose job","Minutes","Done means","Checklist","Notes"]];
 tasks().sort((a,b)=>a.room.localeCompare(b.room)||a.name.localeCompare(b.name)).forEach(t=>rows.push([t.name,t.room,freqText(t),t.next,t.lastDone||"",pName(t.assignee),t.mins,t.standard||"",(t.steps||[]).join("; "),t.notes||""]));
 return rows.map(r=>r.map(q).join(",")).join("\n");
}

/* Arranging (long-press) */
const arr={timer:null,row:null,x:0,y:0,drag:null};
function startArrange(list){
 ui.arranging=list.dataset.sort;list.classList.add("arranging");
 list.insertAdjacentHTML("beforebegin",`<div class="arrange-bar"><span>Drag to reorder</span><button class="btn small primary" data-arrdone="1">Done</button></div>`);
 haptic(12);
}
function finishArrange(){
 const list=document.querySelector(".list.arranging");if(!list){ui.arranging=null;return}
 const key=list.dataset.sort,ids=[...list.querySelectorAll("[data-row]")].map(r=>r.dataset.row);
 if(key==="today")ids.forEach((id,i)=>{if(D.tasks[id]&&D.tasks[id].ord!==i)patch("tasks",id,{ord:i})});
 if(key&&key.startsWith("shift:")){const r=D.routines[key.slice(6)];if(r){const by=Object.fromEntries(r.items.map(i=>[i.id,i]));const items=ids.map(id=>by[id]).filter(Boolean);r.items.forEach(i=>{if(!ids.includes(i.id))items.push(i)});updateRoutine(r,{items})}}
 ui.arranging=null;render();toast("Order saved");
}
document.addEventListener("pointerdown",e=>{
 const row=e.target.closest(".list[data-sort] [data-row]");if(!row||ui.arranging)return;
 arr.x=e.clientX;arr.y=e.clientY;arr.row=row;
 clearTimeout(arr.timer);arr.timer=setTimeout(()=>{const list=row.closest(".list[data-sort]");if(list&&!swipeState.moved){swipeState.el=null;startArrange(list);swipeState.blockClick=true;setTimeout(()=>swipeState.blockClick=false,600)}},550);
},true);
document.addEventListener("pointermove",e=>{
 if(arr.timer&&arr.row&&(Math.abs(e.clientX-arr.x)>8||Math.abs(e.clientY-arr.y)>8)){clearTimeout(arr.timer);arr.timer=null}
 const g=arr.drag;if(!g)return;e.preventDefault();
 const dy=e.clientY-g.y;g.el.style.transform=`translateY(${dy}px)`;
 const sib=[...g.list.children].filter(x=>x!==g.el);
 for(const s of sib){const r=s.getBoundingClientRect();const mid=r.top+r.height/2;
  if(dy>0&&e.clientY>mid&&g.el.compareDocumentPosition(s)&Node.DOCUMENT_POSITION_FOLLOWING){s.after(g.el);g.y=e.clientY;g.el.style.transform="";break}
  if(dy<0&&e.clientY<mid&&g.el.compareDocumentPosition(s)&Node.DOCUMENT_POSITION_PRECEDING){s.before(g.el);g.y=e.clientY;g.el.style.transform="";break}}
},{passive:false});
document.addEventListener("pointerup",()=>{clearTimeout(arr.timer);arr.timer=null;arr.row=null;if(arr.drag){arr.drag.el.style.transform="";arr.drag.el.classList.remove("dragging");arr.drag=null}});
document.addEventListener("pointerdown",e=>{
 const list=e.target.closest(".list.arranging");if(!list)return;
 const item=e.target.closest(".list.arranging > *");if(!item)return;
 e.preventDefault();arr.drag={el:item,list,y:e.clientY};item.classList.add("dragging");
});

/* Pull to refresh */
const ptr=document.createElement("div");ptr.className="ptr";ptr.setAttribute("aria-hidden","true");document.body.appendChild(ptr);
const pull={y0:null,dy:0};
document.addEventListener("touchstart",e=>{if(window.scrollY>0||ui.sheet||ui.pin||ui.arranging||e.target.closest(".sheet,.swipe"))return;pull.y0=e.touches[0].clientY;pull.dy=0},{passive:true});
document.addEventListener("touchmove",e=>{if(pull.y0==null)return;pull.dy=Math.max(0,e.touches[0].clientY-pull.y0);if(pull.dy>10){ptr.textContent=pull.dy>70?"Release to sync":"Pull to sync";ptr.style.opacity=Math.min(1,pull.dy/70);ptr.style.transform=`translate(-50%,${Math.min(pull.dy,90)/2}px)`}},{passive:true});
document.addEventListener("touchend",async()=>{if(pull.y0==null)return;const go=pull.dy>70;pull.y0=null;
 if(!go){ptr.style.opacity=0;return}
 ptr.textContent="Syncing…";haptic(8);await forceSync();ptr.textContent=S.note.startsWith("Offline")?"Couldn't reach the server":"Up to date";setTimeout(()=>ptr.style.opacity=0,900)});
async function forceSync(){
 if(!ME.house)return;await flush();
 try{const res=await api("GET",null,{h:ME.house,k:authKey()});loadMeta(res);loadDocs(res.docs,res.v);if(S.note.startsWith("Offline"))S.note="";render();loadForecast(true).then(()=>render())}
 catch(e){if(e.code!=="not_found")S.note="Offline. Your changes are saved on this phone and will sync when you're back online.";render()}
}

/* Events */
document.addEventListener("click",async e=>{
 const b=e.target.closest("button,label");if(!b)return;const ds=b.dataset;
 // Undo for deletes
 if(ds.del!=null&&ui.sheet&&ui.sheet.kind==="task"){const id=ui.sheet.id,copy=Object.assign({},D.tasks[id]);setTimeout(()=>toast(`Deleted “${copy.name}”`,()=>put("tasks",id,copy)),0);return}
 if(ds.gdel!=null&&ui.sheet&&ui.sheet.kind==="form"){const {col,id}=ui.sheet,copy=Object.assign({},D[col][id]);setTimeout(()=>toast("Deleted",()=>put(col,id,copy)),0);return}
 if(ds.rotate){e.stopImmediatePropagation();if(ds.rotate==="1"){ui.confirmRotate=true;render();return}if(ds.rotate==="0"){ui.confirmRotate=false;render();return}
  try{await houseAction({rotate:true});ui.confirmRotate=false;toast("New invite link ready. The old one no longer works.")}catch(err){toast("Couldn't reset the link. Check your connection.")}render();return}
 if(ds.askrevoke){e.stopImmediatePropagation();ui.confirmRevoke=ds.askrevoke;render();return}
 if(ds.revoke!=null){e.stopImmediatePropagation();const id=ds.revoke;ui.confirmRevoke=null;if(!id){render();return}try{await houseAction({revoke:id});toast("Phone removed")}catch(err){toast("Couldn't remove that phone. Check your connection.")}render();return}
 if(ds.season){e.stopImmediatePropagation();ui.tab="schedule";ui.schedView="seasonal";render();window.scrollTo(0,0);return}
 if(ds.arrdone){e.stopImmediatePropagation();finishArrange();return}
 if(ds.prepdismiss){e.stopImmediatePropagation();const p=Object.assign({},(D.house&&D.house.prep)||{},{[ds.prepdismiss]:"dismissed"});putHouse({prep:p});return}
 if(ds.placefind){e.stopImmediatePropagation();const q=document.getElementById("place-q").value.trim();if(!q)return;try{ui.places=await findPlace(q)}catch(err){ui.places=null;toast("Couldn't look up towns right now.")}render();return}
 if(ds.placepick!=null){e.stopImmediatePropagation();const p=ui.places[+ds.placepick];ui.places=null;putHouse({place:p});await loadForecast(true);render();return}
 if(ds.placeclear){e.stopImmediatePropagation();const h=Object.assign({},D.house);delete h.place;setHouse(h);return}
 if(ds.pinset){e.stopImmediatePropagation();const v=document.getElementById("pin-new").value;if(!/^\d{4}$/.test(v)){toast("Use exactly 4 digits.");return}putHouse({kidPin:await sha(v)});toast("PIN saved");return}
 if(ds.pinclear){e.stopImmediatePropagation();const h=Object.assign({},D.house);delete h.kidPin;setHouse(h);toast("PIN turned off");return}
 if(ds.pinkey!=null){e.stopImmediatePropagation();const p=ui.pin;if(!p)return;const k=ds.pinkey;if(k==="⌫")p.entry=p.entry.slice(0,-1);else if(p.entry.length<4)p.entry+=k;p.err="";drawPin();
  if(p.entry.length===4){const ok=(await sha(p.entry))===(D.house&&D.house.kidPin);if(ok){const f=p.onOk;ui.pin=null;drawPin();f()}else{p.entry="";p.err="That's not it. Try again.";haptic([20,40,20]);drawPin()}}return}
 if(ds.pincancel){e.stopImmediatePropagation();ui.pin=null;drawPin();return}
 if(ds.exitkid){const leaving=!(ui.kid!=="pick"&&kids().length>1);if(leaving&&D.house&&D.house.kidPin){e.stopImmediatePropagation();showPin(()=>{ui.kid=null;render()})}return}
 if(ds.backup){e.stopImmediatePropagation();downloadFile(`upkeep-backup-${today()}.json`,backupJson(),"application/json");return}
 if(ds.csv){e.stopImmediatePropagation();downloadFile(`upkeep-tasks-${today()}.csv`,tasksCsv(),"text/csv");return}
 if(ds.restore!=null){e.stopImmediatePropagation();if(ds.restore==="1"&&ui.restore){const docs=ui.restore.docs;
   COLS.forEach(c=>{Object.keys(D[c]).forEach(id=>{if(!(docs[c]&&docs[c][id]))queueOp({t:"del",c,i:id})});Object.entries(docs[c]||{}).forEach(([id,d])=>queueOp({t:"set",c,i:id,d}))});
   if(docs.house&&docs.house.main)setHouse(docs.house.main);toast("Backup restored")}
  ui.restore=null;render();return}
},true);
document.addEventListener("change",async e=>{
 const el=e.target;
 if(el.dataset.prep){const k=el.dataset.prep,i=+el.dataset.i;const cur=(D.house&&D.house.prep&&D.house.prep[k]);let arr2=Array.isArray(cur)?[...cur]:[];if(el.checked){if(!arr2.includes(i))arr2.push(i)}else arr2=arr2.filter(x=>x!==i);putHouse({prep:Object.assign({},(D.house&&D.house.prep)||{},{[k]:arr2})});haptic(8);return}
 if(el.id==="kiddevice"){ME.kidDevice=el.checked;saveMe();return}
 if(el.id==="kidsound"){ME.kidSound=el.checked;saveMe();return}
 if(el.id==="restore-file"){const f=el.files&&el.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=="upkeep"||!j.docs)throw 0;const count=COLS.reduce((n,c)=>n+Object.keys(j.docs[c]||{}).length,0);ui.restore={docs:j.docs,when:new Date(j.exported).toLocaleString(),count};render()}catch(err){toast("That file isn't an Upkeep backup.")}return}
});

/* Hooks: run after every render */
function render(){
 renderBase();
 if(S.mode==="db"){checkMilestones();if(ME.kidDevice&&!ui.kid&&!ui.kidBooted&&kids().length){ui.kidBooted=true;ui.kid=kids().length===1?kids()[0].id:"pick";renderBase()}}
 if(ui.arranging){const l=document.querySelector(`.list[data-sort="${ui.arranging}"]`);if(l&&!l.classList.contains("arranging"))startArrange(l)}
}
setInterval(()=>{if(D.house&&D.house.place)loadForecast().then(c=>{if(c&&ui.tab==="today")render()})},30*60e3);
window.addEventListener("load",()=>setTimeout(()=>{if(D.house&&D.house.place)loadForecast().then(()=>render())},1500));

boot();
